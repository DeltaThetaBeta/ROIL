<title>Retail Operations Issue Log</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Same reset the Claude artifact skeleton provided */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
/* Layout: single phone-first column (max 760px); fixed bottom tab bar on phones, top tab bar on wide screens. Inspection-tag feel: condensed labels, mono data. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --ink:#16201c; --muted:#5a6a64; --line:#d3dcd8;
  --accent:#0e6a5a; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --open:#a85507; --open-soft:#fbe9d6; --follow:#8a3fb0; --follow-soft:#efe1f6; --good:#1c7443; --good-soft:#dcf0e3; --bad:#b3261e;
  --f-display:"Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,Roboto,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --r:10px;--r-sm:8px;--r-pill:999px;--r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e4ebe8; --muted:#93a39d; --line:#2b3632;
  --accent:#43b89e; --accent-ink:#04211b; --accent-soft:#18332c;
  --open:#e9a159; --open-soft:#3a2914; --follow:#c99ae3; --follow-soft:#33233d; --good:#62cb8e; --good-soft:#173525; --bad:#f2786e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e4ebe8; --muted:#93a39d; --line:#2b3632;
  --accent:#43b89e; --accent-ink:#04211b; --accent-soft:#18332c;
  --open:#e9a159; --open-soft:#3a2914; --follow:#c99ae3; --follow-soft:#33233d; --good:#62cb8e; --good-soft:#173525; --bad:#f2786e;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:28px;letter-spacing:.06em;line-height:1}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)} .sync.local i{background:var(--open)}
h2{font-family:var(--f-display);font-size:22px;letter-spacing:.03em;margin:0;text-wrap:balance}
.label{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.stack{display:grid;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
body[data-mode="ds"] nav.tabs [data-mode="issues"],body:not([data-mode="ds"]) nav.tabs [data-mode="ds"]{display:none}
nav.tabs button{background:none;border:0;padding:10px 2px 9px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;position:relative;white-space:nowrap}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--open);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
@media (min-width:900px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);max-width:760px;margin:0 auto;border-radius:0 0 var(--r) var(--r);border-inline:1px solid var(--line)}
  nav.tabs button{grid-auto-flow:column;justify-content:center;align-items:center;gap:8px;padding:12px 4px}
  nav.tabs .badge{position:static;margin-left:-2px}
  body{display:flex;flex-direction:column}
  nav.tabs{order:-1;width:100%}
  .wrap{width:100%}
  .wrap{padding-block:16px 40px}
}

/* capture */
.photo-drop{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);background:var(--sunk);min-height:150px;cursor:pointer;text-align:center;padding:16px;position:relative;overflow:hidden}
.photo-drop svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.6}
.photo-drop strong{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-drop.has{padding:0;border-style:solid;min-height:0}
.photo-drop.has img{display:block;width:100%;max-height:340px;object-fit:cover}
.photo-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px}
.when{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
select,input[type=text],input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.two.collapse{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:8px 13px;cursor:pointer;font-size:15px;line-height:1.2;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-shadow:.35px 0 0 currentColor}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:11px 6px;cursor:pointer;font-weight:500;min-height:46px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);text-shadow:.35px 0 0 currentColor}
.seg.status button[data-v="Fixed"][aria-pressed="true"]{background:var(--good);color:var(--surface)}
.seg.status button[data-v="Open"][aria-pressed="true"]{background:var(--open);color:var(--surface)}
.seg.status button[data-v="Needs follow-up"][aria-pressed="true"]{background:var(--follow);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;min-height:56px}
.btn.small{min-height:36px;padding:6px 11px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn:disabled{opacity:.55;cursor:default}
.req{color:var(--bad);font-size:13px;font-family:var(--f-body);text-transform:none;letter-spacing:0;margin-left:6px}

/* items */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.item .thumb{width:64px;height:64px;border-radius:6px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:10px}
.item .body{min-width:0;display:grid;gap:3px}
.item .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:4px;padding:2px 6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.pill.Open{background:var(--open-soft);color:var(--open)}
.pill.Needs{background:var(--follow-soft);color:var(--follow)}
.pill.Fixed{background:var(--good-soft);color:var(--good)}
.age{font-family:var(--f-mono);font-size:12px;color:var(--open)}
.fu{display:grid;gap:8px}
.fu .actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters .wide{grid-column:1/-1}
@media (min-width:640px){.filters{grid-template-columns:repeat(4,1fr)}}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700}
.tile .k{font-size:13px;color:var(--muted)}
.tile.warn .v{color:var(--open)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.6em;gap:10px;align-items:center;font-size:14px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar .bt i{display:block;height:100%;background:var(--accent)}
.bar .bt i.o{background:var(--open)}
.bar .bn{font-family:var(--f-mono);font-size:13px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.trend{display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:1px solid var(--line);padding-top:16px}
.trend .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.trend .c i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.trend .c b{font-family:var(--f-mono);font-size:10px;font-weight:400;color:var(--muted);position:absolute;top:-14px}
.tlabels{display:flex;gap:4px;margin-top:4px}
.tlabels span{flex:1;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.hot{display:grid;gap:6px}
.hot div{display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:baseline;font-size:15px}
.hot b{font-family:var(--f-mono);font-weight:500;color:var(--open);text-align:right}
.insight{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.stats-grid{display:grid;gap:12px}
@media (min-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.stats-grid .full{grid-column:1/-1}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:var(--r-lg);max-height:88%}}
.sheet img{width:100%;border-radius:var(--r-sm);max-height:420px;object-fit:contain;background:var(--sunk)}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (min-width:900px){.toast{bottom:24px}}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--open-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
code.ex{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 4px;border-radius:3px}
.lsec{display:grid;gap:10px}
.lsec>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lsec h3{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;margin:0}
.lrows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 40px;gap:4px;align-items:center}
.lrow input[type=text],.ladd input[type=text]{min-height:42px;padding:8px 10px}
.ib{width:40px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.3;cursor:default}
.ib.del{color:var(--bad)}
.ib.del.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ladd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
details.dept{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
details.dept>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;list-style:none}
details.dept>summary::-webkit-details-marker{display:none}
details.dept>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-left:4px}
details.dept[open]>summary::after{transform:rotate(-135deg)}
details.dept>summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
details.dept[open]>summary{border-bottom:1px solid var(--line)}
.dbody{padding:12px;display:grid;gap:12px;background:var(--bg);border-radius:0 0 var(--r-sm) var(--r-sm)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.saving{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* Wider screens: more room for lists, the form stays readable */
@media (min-width:1000px){
  .wrap{max-width:1120px}
  nav.tabs{max-width:1120px}
  #v-log,#v-lists{max-width:680px;width:100%;margin-inline:auto}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .sheet{max-width:820px}
}
@media (min-width:1400px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.photo-drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.banner .btn{flex:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

button.sync{border:0;background:none;cursor:pointer;padding:6px 0}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

details.arch{border-top:1px dashed var(--line);padding-top:8px}
details.arch>summary{cursor:pointer;font-size:14px;color:var(--muted);padding:4px 0}
details.arch .lrows{margin-top:8px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto auto 40px;gap:8px;align-items:center}
.arow .an{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
#fIssue .cgroup{display:grid;gap:6px}
#fIssue .cgroup+.cgroup{margin-top:10px}
.cglabel{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.rite{display:grid;gap:8px;margin-top:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r-sm)}
.lrow.irow select.icat{grid-column:1/-1;min-height:36px;padding:6px 10px;font-size:14px}
/* ---------- Appearance settings (Lists → Appearance). Set as attributes on <html>. ---------- */
:root[data-shape="soft"]{--r:6px;--r-sm:5px;--r-pill:8px;--r-lg:8px}
:root[data-shape="square"]{--r:2px;--r-sm:2px;--r-pill:2px;--r-lg:2px}
:root[data-size="compact"] body{zoom:.9}
:root[data-size="large"] body{zoom:1.15}
/* High contrast: pure backgrounds, darker text and much stronger outlines */
:root[data-contrast="high"]{--bg:#ffffff;--surface:#ffffff;--sunk:#eef1f0;--ink:#000000;--muted:#2b3632;--line:#6b7c76}
@media (prefers-color-scheme: dark){:root[data-contrast="high"]:not([data-theme="light"]){--bg:#000000;--surface:#0b100e;--sunk:#141b18;--ink:#ffffff;--muted:#d3ddd9;--line:#7f918a}}
:root[data-contrast="high"][data-theme="dark"]{--bg:#000000;--surface:#0b100e;--sunk:#141b18;--ink:#ffffff;--muted:#d3ddd9;--line:#7f918a}
:root[data-contrast="high"] :focus-visible{outline-width:3px}
:root[data-contrast="high"] .chip,:root[data-contrast="high"] .btn,:root[data-contrast="high"] .seg,:root[data-contrast="high"] .item,:root[data-contrast="high"] .panel{border-width:2px}
/* Color-blind friendly statuses: orange / blue / slate instead of orange / purple / green */
:root[data-status="cb"]{--open:#b84f00;--open-soft:#fde6d4;--follow:#1f5fbf;--follow-soft:#dde8fa;--good:#3d4f5c;--good-soft:#e1e7eb}
@media (prefers-color-scheme: dark){:root[data-status="cb"]:not([data-theme="light"]){--open:#ff9e57;--open-soft:#3d2510;--follow:#8ab4ff;--follow-soft:#1a2a45;--good:#c2ced6;--good-soft:#27323a}}
:root[data-status="cb"][data-theme="dark"]{--open:#ff9e57;--open-soft:#3d2510;--follow:#8ab4ff;--follow-soft:#1a2a45;--good:#c2ced6;--good-soft:#27323a}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw-theme{display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px}
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.pal{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:6px 8px;cursor:pointer;text-align:left;font-size:13px;min-height:44px;min-width:0}
.pal>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);text-shadow:.35px 0 0 currentColor}
.pv{position:relative;flex:none;width:34px;height:26px;border-radius:4px;overflow:hidden;border:1px solid rgba(127,127,127,.35);display:flex;align-items:flex-end;gap:2px;padding:3px}
.pv i{position:absolute;inset:5px 5px 11px 5px;border-radius:2px;border:1px solid transparent}
.pv b{position:relative;width:7px;height:5px;border-radius:1px}
.pv-roil{background:linear-gradient(135deg,#eef2f0 50%,#0f1513 50%)}
.pv-roil i{background:linear-gradient(135deg,#ffffff 50%,#18201d 50%)}
.pv-roil b{background:#0e6a5a;width:9px}
.ced{display:grid;gap:10px;margin-top:10px;padding:12px;border:1px dashed var(--line);border-radius:var(--r-sm)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.cfield{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.cfield input{width:36px;height:30px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--surface);cursor:pointer;flex:none}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swc{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--muted)}
.swc input{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;padding:2px;background:var(--surface);cursor:pointer}
.lsec>header .btn{margin-left:auto}
/* ---------- Log screen (Phase 2): cards, before/after boxes, summary rows, steps, save bar ---------- */
p.req{margin:0 0 6px;font-weight:600}
#v-log,#logBody,.lcb,#partBody{grid-template-columns:minmax(0,1fr)}
.lcard,.part,#fIssue{min-width:0}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.lch{display:flex;align-items:center;gap:8px}
.lch svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.lch h3{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;margin:0;text-transform:uppercase}
.lcb{gap:14px}
.pboxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbox{position:relative;min-width:0}
.pboxes .photo-drop{min-height:160px;padding:12px}
.pboxes .photo-drop svg{width:34px;height:34px}
.pboxes .photo-drop strong{font-size:18px}
.pboxes .ph-hint{font-size:13px}
.pboxes .photo-drop.has{padding:0}
.pboxes .photo-drop.has::after{content:attr(data-tag);position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.pboxes .photo-drop.has img{height:100%;min-height:160px;max-height:240px;object-fit:cover}
.photo-drop.after svg{stroke:var(--good)}
.photo-drop.after.off{opacity:.62;border-style:dotted}
.photo-drop.after.off svg{stroke:var(--muted)}
.photo-drop.after.unsaved{outline:2px dashed var(--open);outline-offset:-2px}
.pclear{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.lsub{font-family:var(--f-body);font-weight:400;text-transform:none;letter-spacing:0;font-size:13px;margin-left:4px}
.small-chips .chip{padding:6px 11px;font-size:14px;min-height:36px}
/* issue category tabs */
.ctabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ctabs::-webkit-scrollbar{display:none}
.ctab{border:1px solid var(--line);background:var(--sunk);border-radius:var(--r-sm);padding:7px 12px;font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;cursor:pointer;color:var(--muted);min-height:38px;white-space:nowrap}
.ctab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
/* compact Why row */
.whyrow{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;width:100%;text-align:left;border:1px dashed var(--line);background:var(--sunk);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;min-height:46px}
.whyrow .k,.srow .k{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.whyrow .chg{margin-left:auto;color:var(--accent);font-weight:600;font-size:14px}
/* summary rows */
.srows{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.srow{display:grid;grid-template-columns:7.5em minmax(0,1fr) 18px;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:left;cursor:pointer;min-height:54px;width:100%}
.srow:first-child{border-top:0}
.srow .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.srow .v.unset{color:var(--muted);font-weight:400}
.srow .v.need{color:var(--accent)}
.srow svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* step strip */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stp{border:0;border-bottom:3px solid var(--line);background:none;padding:4px 2px 6px;text-align:left;cursor:pointer;display:grid;gap:1px;min-width:0;min-height:44px}
.stp b{font-family:var(--f-display);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp.done{border-bottom-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.stp.done span{color:var(--ink)}
.stp[aria-current="step"]{border-bottom-color:var(--accent)}
.stp[aria-current="step"] b{color:var(--accent)}
.log-steps .lcard{min-height:46vh;align-content:start}
/* save bar: stays within thumb reach above the tab bar */
.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:8px;padding:10px 0 4px;background:linear-gradient(to bottom,transparent,var(--bg) 14px)}
.savebar .btn{min-height:56px}
.savebar .btn.big{flex:1;width:auto}
.savebar #stepBack,.savebar #stepSkip{flex:none;min-width:84px}
@media (max-width:899.98px){
  .savebar{position:fixed;left:0;right:0;bottom:calc(var(--navh,63px) + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto;padding:12px 16px 8px;z-index:15}
  #v-log{padding-bottom:64px}
  body:has(#v-log:not([hidden])) .toast{bottom:calc(var(--navh,63px) + 84px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:900px){.savebar{bottom:0;padding-bottom:12px}}
/* list thumbnails and the issue screen: before and after side by side */
.item .thumb.ba{display:grid;grid-template-columns:1fr 1fr;gap:1px;overflow:hidden;padding:0}
.item .thumb.ba img{width:100%;height:100%;object-fit:cover;display:block}
.ba2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ba2 figure{margin:0;display:grid;gap:4px;min-width:0}
.ba2 figure img,.sheet .ba2 img{width:100%;height:clamp(170px,42vw,340px);max-height:none;object-fit:contain;border-radius:var(--r-sm);background:var(--sunk)}
.ba2 figcaption{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.np2{display:grid;place-items:center;width:100%;height:clamp(170px,42vw,340px);border:2px dashed var(--line);border-radius:var(--r-sm);background:var(--sunk);color:var(--muted);font-size:14px;text-align:center;padding:10px}
.np2.addafter{color:var(--accent);font-weight:600;cursor:pointer;border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.lockn{margin:6px 0 0;font-size:13px}
button.linkish{border:0;background:none;padding:0;font-size:inherit;min-height:0}
.linkish.rm{color:var(--bad)}
.linkish.rm.armed{font-weight:700}
#dBA.busy{opacity:.5;pointer-events:none}
.linkish{color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:0;font-family:var(--f-body);text-decoration:underline}

/* ---------- SKUs, items found, scanning (Phase 3) ---------- */
.skub{display:grid;gap:14px}
.skuin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.skuin input{font-size:18px;letter-spacing:.06em}
.skuinfo{margin-top:6px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.skuinfo .ladd{width:100%}
.found{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r-sm);padding:8px 8px 8px 10px}
.frow.v-right{border-left-color:var(--good)}.frow.v-wrong{border-left-color:var(--bad)}
.fmain{display:grid;gap:3px;min-width:0;cursor:pointer;border-radius:6px}
.fmain:focus-visible{outline-offset:4px}
.fmain .fcode::after{content:"Edit";margin-left:8px;font-family:var(--f-body);font-size:12px;color:var(--accent);text-decoration:underline}
.frow.editing .fmain .fcode::after{content:"Close"}
.frow.editing{border-color:var(--accent)}
.fedit{grid-column:1/-1;display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px;margin-top:2px}
.fedit .label{margin-bottom:4px}
.fedit input[type=number]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
.locchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;margin-bottom:4px}
.locchips .chip{min-height:34px;padding:5px 10px;font-size:13px}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.85}
.fcode{font-size:14px;overflow-wrap:anywhere}
.fsub{font-size:13px;color:var(--muted)}
.fask{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.qty{display:flex;align-items:center;gap:4px}
.qty .ib{width:36px;height:36px;font-size:18px}
.qty span{min-width:2ch;text-align:center}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.pill:not(.Open):not(.Needs):not(.Fixed):not(.bad):not(.dsx):not([class*="nt-"]){background:var(--sunk);color:var(--muted)}
.ladd.three{grid-template-columns:minmax(0,1fr) auto auto}
.warnline{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:var(--r-sm);padding:6px 10px}
#scanHost .overlay{z-index:60}
.scansheet{gap:10px}
.scanview{position:relative;background:#000;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:4/3;max-height:52vh}
.scanview video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18% 12%;border:3px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.scanlog{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-family:var(--f-mono);font-size:13px}
.scanlog li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.scanlog li:first-child{border-color:var(--accent)}
.pairnow{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pairnow b{font-size:24px;letter-spacing:.06em}
.savebar .scanb{flex:none;min-width:64px;padding:6px 10px;display:grid;justify-items:center;gap:0;font-size:12px;line-height:1.1}
.savebar .scanb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#foundOpen{justify-self:start;margin-top:4px}
.topr{display:flex;align-items:center;gap:10px;flex:none}
.notebtn{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:5px 11px 5px 8px;min-height:34px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.notebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.notebtn b{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:10px;font-weight:500;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
@media (max-width:420px){.brand span{display:none}}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) 40px;gap:10px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.nrow p{margin:6px 0 4px;overflow-wrap:anywhere}
.nrow.done .nbody{opacity:.6}.nrow.done p{text-decoration:line-through}
.ncheck input{width:22px;height:22px;accent-color:var(--accent);margin:2px 0 0}
.pill.nt-bug{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.pill.nt-improve{background:var(--accent-soft);color:var(--accent)}
.pill.nt-feature{background:var(--follow-soft);color:var(--follow)}
.modesw{margin:-4px 0 12px}
.modesw button{min-height:38px;padding:6px;font-family:var(--f-display);letter-spacing:.05em;text-transform:uppercase;font-size:14px}
.dsfrom{margin:0}
.dscov{display:grid;gap:8px}
.covtop{display:flex;align-items:baseline;gap:10px}.covtop b{font-family:var(--f-display);font-size:34px;line-height:1}
.covbar{display:flex;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.covbar i{display:block;height:100%}.covbar i.d{background:var(--good)}.covbar i.p{background:var(--open)}
.dsrun{display:grid;gap:10px;border-color:var(--accent)}
.dsrunlist{display:flex;flex-wrap:wrap;gap:6px}
.chip.static{cursor:default;min-height:30px;padding:4px 10px;font-size:13px}
.dsrows{display:grid;gap:6px}
.dsrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;min-height:48px}
.dsrow.inrun{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dsn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dsp{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.dsl{grid-column:1/-1;font-size:12px}.dsl:empty{display:none}
.toptag{font-family:var(--f-mono);font-size:10px;font-weight:500;color:var(--follow);text-transform:uppercase;margin-left:4px}
.pill.dsx{background:var(--accent-soft);color:var(--accent)}
.dsfirst{border-color:var(--follow)}
.rflist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rfrow{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px}
.rfname{font-weight:600}
.rfrow .seg button{min-height:40px;padding:6px 4px;font-size:14px}
.dsday{display:grid;gap:6px}
.ghostchip{border-style:dashed}
.fustack{display:grid;gap:12px}
.fustack .label{margin-bottom:4px}
.dupw{display:grid;gap:4px;justify-items:start}
.dupw .item{width:100%}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>ROIL</b><span>Retail Operations Issue Log</span></div>
    <div class="topr"><button class="notebtn" id="noteBtn" type="button" aria-label="Jot a note for later" title="Jot down a bug or idea"><svg viewBox="0 0 24 24"><path d="M5 19.5V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v9.5L14.5 19H6a1 1 0 0 1-1-.5z"/><path d="M14 19v-4a1 1 0 0 1 1-1h4M8.5 8.5h7M8.5 12h4.5"/></svg><span>Note</span><b id="noteBadge" hidden></b></button>
    <button class="sync" id="sync" type="button"><i></i><span>Starting…</span></button></div>
  </header>
  <div class="seg modesw" id="modeSw" role="group" aria-label="Mode"><button type="button" data-m="issues" aria-pressed="true">Issues</button><button type="button" data-m="ds" aria-pressed="false">Downstock</button></div>
  <div id="banner"></div>

  <!-- LOG -->
  <section id="v-log" class="stack">
    <p class="banner dsfrom" id="dsFrom" hidden><span>Found while downstocking</span><button type="button" class="btn small ghost" id="dsFromX">Not from downstocking</button></p>
    <div id="logSteps" class="steps" hidden></div>
    <div id="logBody" class="stack"></div>
    <div class="savebar" id="saveBar">
      <button class="btn" id="stepBack" type="button" hidden>Back</button>
      <button class="btn scanb" id="scanBtn" type="button" hidden aria-label="Scan a shelf tag or barcode"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M17 9v6"/></svg><span>Scan</span></button>
      <button class="btn ghost" id="stepSkip" type="button" hidden>Skip</button>
      <button class="btn primary big" id="stepNext" type="button" hidden>Next</button>
      <button class="btn primary big" id="saveBtn" type="button">Save issue</button>
    </div>

    <!-- The Log screen's fields. Each layout (Sections, Summary rows, Step-by-step) moves these into place. -->
    <div id="logParts" hidden>
      <div class="part" id="part-photos">
        <div class="pboxes">
          <div class="pbox">
            <label class="photo-drop" id="photoDrop" for="photoIn" data-tag="Before">
              <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
              <strong>Before</strong>
              <span class="muted ph-hint" id="beforeHint">Take photo</span>
              <input id="photoIn" type="file" accept="image/*" capture="environment">
            </label>
            <button class="pclear" id="clearPhoto" type="button" hidden aria-label="Remove before photo">×</button>
          </div>
          <div class="pbox">
            <label class="photo-drop after" id="afterDrop" for="afterIn" data-tag="After">
              <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M9.5 12.5l1.8 1.8 3.4-3.6"/></svg>
              <strong>After</strong>
              <span class="muted ph-hint" id="afterHint">Add when fixed</span>
              <input id="afterIn" type="file" accept="image/*" capture="environment">
            </label>
            <button class="pclear" id="clearAfter" type="button" hidden aria-label="Remove after photo">×</button>
          </div>
        </div>
        <div class="photo-tools"><span class="when" id="when"></span></div>
      </div>
      <div class="part" id="part-where">
        <p class="req" id="reqDept" hidden>Pick a department</p>
        <div class="two collapse">
          <select id="fDept" aria-label="Department"></select>
          <select id="fSub" aria-label="Planogram"></select>
        </div>
      </div>
      <div class="part" id="part-sku"><div id="fSkuBox"></div></div>
      <div class="part" id="part-found"><div id="fFound"></div><button type="button" class="btn small ghost" id="foundOpen">+ Items found</button></div>
      <div class="part" id="part-issue">
        <p class="req" id="reqIssue" hidden>Pick what's wrong</p>
        <div id="fIssue" role="group" aria-label="Issue"></div>
        <div class="rite" id="fPrsWrap" hidden><span class="label" style="margin:0">What was missed</span><div class="chips small-chips" id="fPrs" role="group" aria-label="PRS missed"></div></div>
        <div class="rite" id="fRiteWrap" hidden><label class="switch"><input type="checkbox" id="fRite"><span>RITE ticket submitted</span></label><input type="text" id="fRiteNo" maxlength="40" placeholder="Ticket number (optional)" aria-label="RITE ticket number"></div>
      </div>
      <div class="part" id="part-source">

/* Accepts every lists format ROIL has used (plain names, or entries with ids) and returns entries with ids. */
function normLists(d){

    removed:has&&Array.isArray(d.removed)?d.removed.filter(x=>ENTRY_ID.test(x)).slice(-2000):[],moved:{}};
  if(has&&d.moved&&typeof d.moved==='object')for(const [a,b] of Object.entries(d.moved))if(ENTRY_ID.test(a)&&ENTRY_ID.test(b))l.moved[a]=b;

  for(const x of deps){

/* Version 3 lists: Source split out of Cause, issue categories, RITE renamed. Runs once on older

const CUSTOMER_CAUSE=()=>sid('c','Customer left item out'),CUSTOMER_SOURCE=()=>sid('o','Customer'),DEMO_CAT=()=>sid('g','Demo units');
const ISSUE_CATS={'Placement':['Wrong facing / placement','Overstuffed','Mixed product','Item in wrong location','Not per planogram'],
  'Pricing & labels':['Missing ESL','ESL not paired','Missing signage'],'Demo units':['RITE','Demo unit issue'],'Condition':['Damaged product or fixture'],'Safety & security':['Safety / security concern','PRS not followed']};
function upgradeLists(l){
  const rite=l.issues.find(e=>e.name.toLowerCase()==='rite');if(rite)rite.name='Demo unit issue';
  for(const [cat,names] of Object.entries(ISSUE_CATS)){const cid=sid('g',cat);
    for(const e of l.issues)if(!e.cat&&names.some(n=>n.toLowerCase()===e.name.toLowerCase()))e.cat=cid}
  const ci=l.causes.findIndex(e=>e.id===CUSTOMER_CAUSE());if(ci>=0){l.causes.splice(ci,1);l.removed.push(CUSTOMER_CAUSE())}

function link(it){

  let d=it.deptId&&IX.dept.get(it.deptId);

    d=byName(lists.departments,it.dept);
    if(!d){d={id:ENTRY_ID.test(it.deptId)?it.deptId:sid('d',it.dept||'?'),name:String(it.dept||'Unknown department').slice(0,120),archived:true,planograms:[]};lists.departments.push(d);IX.dept.set(d.id,d);changed=true}
  }
  it.deptId=d?d.id:'';it.dept=d?d.name:'';
  let pg=it.planogramId&&IX.pog.get(it.planogramId);
  if(!pg&&(it.planogram||it.planogramId)&&d){
    let p=byName(d.planograms,it.planogram);
    if(!p){p={id:ENTRY_ID.test(it.planogramId)?it.planogramId:sid('p',d.name+'\u0001'+(it.planogram||'?')),name:String(it.planogram||'Unknown planogram').slice(0,120),archived:true};d.planograms.push(p);changed=true}
    pg={p,d};IX.pog.set(p.id,pg);
  }
  it.planogramId=pg?pg.p.id:'';it.planogram=pg?pg.p.name:'';

/* Merge two versions of the lists: renames and order from the newer one; entries added on
   either side are kept; entries deleted or merged away on either side stay gone. */
function mergeLists(a,b){
  const [newer,older]=(b.updated||'')>(a.updated||'')?[b,a]:[a,b];
  const out=normLists(listsBody(newer));
  out.removed=[...new Set([...(a.removed||[]),...(b.removed||[])])].slice(-2000);
  out.moved={...(older.moved||{}),...(newer.moved||{})};
  const gone=new Set([...out.removed,...Object.keys(out.moved)]);
  const keep=arr=>arr.filter(e=>!gone.has(e.id));
  out.departments=keep(out.departments);for(const d of out.departments)d.planograms=keep(d.planograms);
  const pogIds=new Set(out.departments.flatMap(d=>d.planograms.map(p=>p.id)));
  for(const od of older.departments){
    if(gone.has(od.id))continue;
    let d=out.departments.find(x=>x.id===od.id);
    if(!d){d={...od,planograms:[]};out.departments.push(d)}
    for(const p of od.planograms)if(!gone.has(p.id)&&!pogIds.has(p.id)){d.planograms.push({...p});pogIds.add(p.id)}
  }
  for(const k in KINDS){out[k]=keep(out[k]);for(const e of older[k])if(!gone.has(e.id)&&!out[k].some(x=>x.id===e.id))out[k].push({...e})}
  out.updated=newer.updated||'';
  return out;
}

    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('outbox',{keyPath:'seq',autoIncrement:true});d.createObjectStore('meta')};

const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

/* ops: [{s:store, v:value, k?:key} | {s:store, del:key}] in one atomic transaction */
async function write(ops){
  const d=await idb();const t=d.transaction([...new Set(ops.map(o=>o.s))],'readwrite');
  for(const o of ops){const st=t.objectStore(o.s);if('del' in o)st.delete(o.del);else if(o.k!==undefined)st.put(o.v,o.k);else st.put(o.v)}

    ops.push({s:'items',v:it});have.set(it.id,it);cur?updated++:added++;
    const p=opt.photos&&data.photos&&data.photos[it.id];
    if(opt.photos&&cur&&((cur.photo&&!it.photo)||(cur.after&&!it.after))){
      const r=await getOne('photos',it.id).catch(()=>null);
      if(r){const rec={...r};if(!it.photo){delete rec.full;delete rec.thumb;delete rec.photoRev}if(!it.after){delete rec.after;delete rec.afterThumb;delete rec.afterRev}ops.push({s:'photos',v:rec});setPhotoUrls(rec)}
    }
    if(p&&(typeof p.full==='string'||typeof p.after==='string')){
      try{const cur=await getOne('photos',it.id).catch(()=>null)||{id:it.id};const rec={...cur,id:it.id};
        if(it.photo&&typeof p.full==='string'){rec.full=b64ToBlob(p.full,'image/jpeg');rec.thumb=typeof p.thumb==='string'?b64ToBlob(p.thumb,'image/jpeg'):rec.full;rec.photoRev=it.photoRev}

        ops.push({s:'photos',v:rec});photos++;setPhotoUrls(rec);
      }catch(e){}
    }
  }
  relinkAll([...have.values()]);ops.push({s:'meta',v:listsBody(lists),k:'lists'});buildForm();
  let apChanged=false;
  if(opt.appearance&&data.appearance&&typeof data.appearance==='object'){const inc=cleanAp(data.appearance);if((inc.updated||'')>(ap.updated||'')){ap=inc;ls.set('roil.appearance',ap);applyAp();apChanged=true;if(loaded)renderLog()}}
  ops.push({s:'meta',v:newTombs,k:'deleted'});if(prodOp)ops.push(prodOp);if(noteOp)ops.push(noteOp);if(dkOp)ops.push(dkOp);

  setItems([...have.values()]);

async function doRestore(file){

/* Google sends you back to ROIL with the access token after the # (never sent to any server). */
function handleOAuthReturn(){
  if(!location.hash||!/(^#|&)(access_token|error)=/.test(location.hash))return;
  const h=new URLSearchParams(location.hash.slice(1));
  history.replaceState(null,'',location.pathname+location.search);
  const want=ls.get('roil.oauthState',null);ls.set('roil.oauthState',null);

  if(!want||h.get('state')!==want){setTimeout(()=>toast('That Google sign-in didn\'t come from this device. Try connecting again.'),300);return}
  if(!(h.get('scope')||DRIVE_SCOPE).includes('drive.file')){setTimeout(()=>toast('ROIL needs permission to its own Drive files. Connect again and tick the Drive box.'),300);return}
  ls.set('roil.gtoken',{token:h.get('access_token'),exp:Date.now()+Math.max(60,Number(h.get('expires_in')||3600))*1000});

async function driveDisconnect(){

async function gfetch(url,opts={}){
  const tok=gToken();if(!tok)throw {reconnect:true};
  let r;try{r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:'Bearer '+tok}})}catch(e){throw {net:true}}
  if(r.status===401){ls.set('roil.gtoken',null);throw {reconnect:true}}
  if(!r.ok){let m='';try{const j=await r.json();m=j.error&&j.error.message}catch(_){}throw {status:r.status,msg:m||('Google Drive error '+r.status)}}
  return r;
}
const Drive={
  async folder(){
    if(syncCfg.folderId){
      try{const j=await (await gfetch(`${GAPI}/drive/v3/files/${encodeURIComponent(syncCfg.folderId)}?fields=id,trashed`)).json();if(j.id&&!j.trashed)return j.id}
      catch(e){if(e.reconnect||e.net)throw e}
    }
    const q=encodeURIComponent("name='ROIL' and mimeType='application/vnd.google-apps.folder' and trashed=false");
    const j=await (await gfetch(`${GAPI}/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`)).json();
    let id=j.files&&j.files[0]&&j.files[0].id;
    if(!id)id=(await (await gfetch(`${GAPI}/drive/v3/files?fields=id`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:'ROIL',mimeType:'application/vnd.google-apps.folder',description:'Retail Operations Issue Log: synced data and photos'})})).json()).id;
    syncCfg.folderId=id;saveSyncCfg();return id;
  },
  async list(folder){
    const out=new Map();let page='';
    do{const q=encodeURIComponent(`'${folder}' in parents and trashed=false`);
      const j=await (await gfetch(`${GAPI}/drive/v3/files?q=${q}&fields=nextPageToken,files(id,name,version)&pageSize=1000&spaces=drive${page?'&pageToken='+encodeURIComponent(page):''}`)).json();
      for(const f of j.files||[])out.set(f.name,f);page=j.nextPageToken||''}while(page);
    return out;
  },
  async version(id){return (await (await gfetch(`${GAPI}/drive/v3/files/${encodeURIComponent(id)}?fields=version`)).json()).version},
  async read(id){return gfetch(`${GAPI}/drive/v3/files/${encodeURIComponent(id)}?alt=media`)},
  async create(folder,name,blob,type){
    const b='roil'+Math.random().toString(36).slice(2);
    const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[folder],mimeType:type})}\r\n--${b}\r\nContent-Type: ${type}\r\n\r\n`,blob,`\r\n--${b}--`]);
    return (await gfetch(`${GAPI}/upload/drive/v3/files?uploadType=multipart&fields=id,name,version`,{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body})).json();
  },
  async update(id,blob,type){return (await gfetch(`${GAPI}/upload/drive/v3/files/${encodeURIComponent(id)}?uploadType=media&fields=id,name,version`,{method:'PATCH',headers:{'Content-Type':type},body:blob})).json()},
  async trash(id){await gfetch(`${GAPI}/drive/v3/files/${encodeURIComponent(id)}?fields=id`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}
};

function sortedProds(){const o={skus:{},upcs:{}};for(const t of['skus','upcs'])for(const k of Object.keys(prods[t]).sort())o[t][k]=prods[t][k];return o}

const pname=(kind,id,rev)=>rev?`${kind}-${id}-${rev}.jpg`:`${kind}-${id}.jpg`;
async function syncPhotos(folder,files){
  const phs=await getAll('photos');const have=new Map(phs.map(p=>[p.id,p]));
  const byId=new Map(items.map(i=>[i.id,i]));let got=0;
  const up=async(name,blob)=>{if(blob&&!files.has(name)){const f=await Drive.create(folder,name,blob,'image/jpeg');files.set(f.name,f)}};
  for(const p of phs){const it=byId.get(p.id);if(!it)continue;
    if(it.photo&&(p.photoRev||'')===(it.photoRev||'')){await up(pname('photo',p.id,it.photoRev),p.full);await up(pname('thumb',p.id,it.photoRev),p.thumb)}
    if(it.after&&it.afterRev&&p.afterRev===it.afterRev){await up(`after-${p.id}-${it.afterRev}.jpg`,p.after);await up(`afterthumb-${p.id}-${it.afterRev}.jpg`,p.afterThumb)}
  }
  for(const it of items){   // photos from other devices: small versions now, full ones when you open the issue
    const p=have.get(it.id),rec=p?{...p}:{id:it.id};let changed=false;
    if(it.photo&&(!rec.thumb||(rec.photoRev||'')!==(it.photoRev||''))){const f=files.get(pname('thumb',it.id,it.photoRev))||files.get(pname('photo',it.id,it.photoRev));
      if(f){const b=await (await Drive.read(f.id)).blob();rec.thumb=b;rec.full=f.name.startsWith('photo-')?b:null;rec.photoRev=it.photoRev||'';changed=true}}
    if(!it.photo&&(rec.full||rec.thumb)){delete rec.full;delete rec.thumb;delete rec.photoRev;changed=true}      // removed on another device
    if(!it.after&&(rec.after||rec.afterThumb)){delete rec.after;delete rec.afterThumb;delete rec.afterRev;changed=true}
    if(it.after&&it.afterRev&&rec.afterRev!==it.afterRev){const f=files.get(`afterthumb-${it.id}-${it.afterRev}.jpg`)||files.get(`after-${it.id}-${it.afterRev}.jpg`);
      if(f){const b=await (await Drive.read(f.id)).blob();rec.afterThumb=b;rec.after=f.name.startsWith('after-')?b:null;rec.afterRev=it.afterRev;changed=true}}
    if(changed){await write([{s:'photos',v:rec}]);setPhotoUrls(rec);got++}
  }
  for(const [name,f] of [...files]){   // tidy Drive: photos of deleted issues, and photos that were replaced or removed
    const m=name.match(/^(photo|thumb|after|afterthumb)-([a-z0-9]+)(?:-([a-z0-9]+))?\.jpg$/);if(!m)continue;
    const it=byId.get(m[2]);
    const stale=it?(m[1].startsWith('after')?!it.after||m[3]!==it.afterRev:!it.photo||(m[3]||'')!==(it.photoRev||'')):!!tombs[m[2]];
    if(stale){await Drive.trash(f.id);files.delete(name)}
  }

}
async function runSync(manual){
  if(syncCfg.dest!=='drive'){syncState='off';setSync();return}
  if(!navigator.onLine){syncState='offline';setSync();if(manual)toast('You\'re offline. Changes will sync when you\'re back online.');return}
  if(!gToken()){syncState='reconnect';setSync();if(view==='lists')renderLists();if(manual)toast('Reconnect Google Drive to sync.');return}
  if(!loaded)return;
  if(syncing){syncAgain=true;return}
  syncing=true;syncState='syncing';syncErr='';setSync();
  const dirtyAtStart=syncDirty;let pulled=null;
  try{
    const folder=await Drive.folder();
    for(let attempt=0;attempt<3;attempt++){
      const files=await Drive.list(folder);driveFiles=files;
      const df=files.get(DATA_FILE);let remoteText='';
      if(df){
        remoteText=await (await Drive.read(df.id)).text();
        let data=null;try{data=JSON.parse(remoteText)}catch(e){}
        if(data&&data.format==='roil-sync')pulled=await mergeIncoming(data,{photos:false,appearance:false});
      }
      await syncPhotos(folder,files);
      const mine=syncDocText();
      if(df&&mine===remoteText)break;
      const blob=new Blob([mine],{type:'application/json'});
      if(df){
        if(String(await Drive.version(df.id))!==String(df.version))continue;   // another device just synced: merge again first
        await Drive.update(df.id,blob,'application/json');
      }else{const f=await Drive.create(folder,DATA_FILE,blob,'application/json');files.set(f.name,f)}
      break;
    }
    syncCfg.lastSync=new Date().toISOString();saveSyncCfg();
    syncDirty=Math.max(0,syncDirty-dirtyAtStart);ls.set('roil.syncDirty',syncDirty);
    syncState='idle';
    if(manual){const n=pulled?pulled.added+pulled.updated+pulled.removed:0;toast(n?`Synced: ${n} change${n===1?'':'s'} from your other devices.`:'Synced. Everything is up to date.')}
  }catch(e){
    syncState=e&&e.reconnect?'reconnect':e&&e.net?'offline':'error';
    syncErr=e&&e.msg?e.msg:(e&&e.name==='QuotaExceededError'?'This device is out of space.':'');
    if(manual&&syncState==='error')toast('Sync problem: '+(syncErr||'try again in a moment.'));
  }finally{
    syncing=false;setSync();if(view==='lists')renderLists();
    if(syncAgain){syncAgain=false;scheduleSync(800)}
  }
}
/* A full photo that came from another device is downloaded the first time it's needed. */
async function ensureFull(id,which='before'){
  const A=which==='after',p=await getOne('photos',id).catch(()=>null);
  const it=items.find(i=>i.id===id);
  if(p&&(A?p.after:p.full&&(p.photoRev||'')===((it&&it.photoRev)||'')))return A?p.after:p.full;
  if(syncCfg.dest==='drive'&&gToken()&&navigator.onLine&&it){
    try{
      const name=A?pname('after',id,it.afterRev):pname('photo',id,it.photoRev);
      let f=driveFiles.get(name);
      if(!f){driveFiles=await Drive.list(await Drive.folder());f=driveFiles.get(name)}
      if(f){const blob=await (await Drive.read(f.id)).blob();const rec={...(p||{id}),id};if(A){rec.after=blob;rec.afterRev=it.afterRev;if(!rec.afterThumb)rec.afterThumb=blob}else{rec.full=blob;rec.photoRev=it.photoRev||'';if(!rec.thumb)rec.thumb=blob}
        await write([{s:'photos',v:rec}]);setPhotoUrls(rec);return blob}
    }catch(e){}

  return p?(A?p.afterThumb:p.thumb)||null:null;
}

(function bindNotes(){
  const el=$('#v-lists');

  });

})();

/* ================= DOWNSTOCK =================
   A daily coverage board: every planogram (or a department with no planograms) is an "area".
   Each day an area is Not done, Partial, Done, or Follow-up (with a reason), plus the extras
   Filled (restocked beyond empties) and LaserLine (fronted). Others' work can be marked
   "Done by someone else" and spot-checked. Runs group the areas you walk together.
   Synced (meta "downstock"): cfg.reasons, cfg.groups, cfg.top, and day records, merged entry by entry. */
const DS_HELP=[['lift','Lift (needs a spotter)'],['ladder','Ladder'],['person','Second person'],['heavy','Heavy or bulky']];
const DS_REASON_DEFAULTS=[["Couldn't find in overstock",'db',0],['Needs equipment or help','help',1],['Waiting on PRS supplies','prs',2],['Overstock in the wrong spot or mixed','',3],['Overstock blocked','',4],['Other','',90]];
const DS_PRS=[['spider','Spider wraps'],['clam','Clamshells'],['limit','Limit-one tags'],['other','Other']];
const DS_WHY=[['time','Ran out of time'],['task','Pulled to another task'],['opened','Store opened (lift needs a spotter)'],['other','Other']];
const DS_ST={none:'Not done',partly:'Partial',done:'Done',follow:'Follow-up'};
let dk={cfg:{reasons:{},groups:{},top:{},skip:{}},days:{}};
function dsDefaults(){
  // starter reasons are added if missing; their kind and order are fixed (names can be changed in Lists)
  DS_REASON_DEFAULTS.forEach(([n,kind,order])=>{const id=sid('r',n),e=dk.cfg.reasons[id];if(!e)dk.cfg.reasons[id]={id,name:n,kind,order,archived:false,updated:''};else{e.kind=kind;e.order=order}});
}
function cleanDk(o){
  const r={cfg:{reasons:{},groups:{},top:{},skip:{}},days:{}};if(!o||typeof o!=='object')return r;const c=o.cfg||{};
  for(const [k,v] of Object.entries(c.skip||{}))if(ENTRY_ID.test(k)&&v&&typeof v==='object')r.cfg.skip[k]={on:!!v.on,updated:String(v.updated||'').slice(0,40)};
  const T=v=>String(v||'').slice(0,40);
  for(const [k,v] of Object.entries(c.reasons||{}))if(ENTRY_ID.test(k)&&v&&typeof v==='object')r.cfg.reasons[k]={id:k,name:String(v.name||'').slice(0,80)||'Reason',kind:['db','help'].includes(v.kind)?v.kind:'',order:+v.order||0,archived:!!v.archived,updated:T(v.updated)};
  for(const [k,v] of Object.entries(c.groups||{}))if(ENTRY_ID.test(k)&&v&&typeof v==='object')r.cfg.groups[k]={id:k,name:String(v.name||'').slice(0,60)||'Group',areas:Array.isArray(v.areas)?v.areas.filter(a=>ENTRY_ID.test(String(a))).slice(0,200):[],deleted:!!v.deleted,updated:T(v.updated)};
  for(const [k,v] of Object.entries(c.top||{}))if(ENTRY_ID.test(k)&&v&&typeof v==='object')r.cfg.top[k]={on:!!v.on,updated:T(v.updated)};
  for(const [k,v] of Object.entries(o.days||{})){
    const m=/^(\d{4}-\d{2}-\d{2})\|([a-z0-9_]{1,40})$/.exec(k);if(!m||!v||typeof v!=='object')continue;
    const arr=(x,ok)=>(Array.isArray(x)?x:x?[x]:[]).map(String).filter(ok).slice(0,10);
    r.days[k]={day:m[1],area:m[2],st:DS_ST[v.st]?v.st:'none',filled:!!v.filled,laser:!!v.laser,
      reasons:arr(v.reasons||v.reason,x=>ENTRY_ID.test(x)),help:arr(v.help,x=>DS_HELP.some(h=>h[0]===x)),prsSup:arr(v.prsSup,x=>DS_PRS.some(h=>h[0]===x)),
      why:DS_WHY.some(w=>w[0]===v.why)?v.why:'',db:!!v.db,dbNo:String(v.dbNo||'').slice(0,40),note:String(v.note||'').slice(0,300),
      by:v.by==='other'?'other':'me',check:['good','missed'].includes(v.check)?v.check:'',t:T(v.t),updated:T(v.updated)};
  }
  return r;
}
function mergeDk(a,b){
  const pick=(x,y)=>{const o={...x};for(const [k,v] of Object.entries(y))if(!o[k]||(v.updated||'')>(o[k].updated||''))o[k]=v;return o};
  return {cfg:{reasons:pick(a.cfg.reasons,b.cfg.reasons),groups:pick(a.cfg.groups,b.cfg.groups),top:pick(a.cfg.top,b.cfg.top),skip:pick(a.cfg.skip||{},b.cfg.skip||{})},days:pick(a.days,b.days)};
}
async function saveDk(){await write([{s:'meta',v:dk,k:'downstock'}]);markChanged()}
const today=()=>localDay(new Date());
const dsReasons=(all)=>Object.values(dk.cfg.reasons).filter(r=>all||!r.archived).sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name));
const dsReason=id=>dk.cfg.reasons[id];
/* areas: active planograms; a department without planograms is one area */
const isSkip=id=>!!(dk.cfg.skip&&dk.cfg.skip[id]&&dk.cfg.skip[id].on);
function dsAreas(all){
  const out=[];
  for(const d of activeOf(lists.departments)){
    const pg=activeOf(d.planograms);
    if(pg.length)for(const p of pg)out.push({id:p.id,dept:d,name:p.name,label:d.name+' › '+p.name});
    else out.push({id:d.id,dept:d,name:d.name,label:d.name,whole:true});
  }
  return all?out:out.filter(a=>!isSkip(a.id)&&!isSkip(a.dept.id));   // areas you've marked as not downstocked are left out
}
const dsArea=id=>dsAreas(true).find(a=>a.id===id);
const rec=(area,day=today())=>dk.days[day+'|'+area];
function setRec(area,patch,day=today()){
  const k=day+'|'+area,cur=dk.days[k]||{day,area,st:'none',filled:false,laser:false,reasons:[],help:[],prsSup:[],why:'',db:false,dbNo:'',note:'',by:'me',check:'',t:''};
  const n={...cur,...patch,updated:nowIso()};if(patch.st&&patch.st!==cur.st)n.t=nowIso();
  if(n.st!=='follow'){n.reasons=[];n.help=[];n.prsSup=[];n.db=false;n.dbNo=''}
  else{const kinds=n.reasons.map(id=>(dsReason(id)||{}).kind);if(!kinds.includes('db')){n.db=false;n.dbNo=''}if(!kinds.includes('help'))n.help=[];if(!kinds.includes('prs'))n.prsSup=[]}
  if(n.st!=='partly')n.why='';
  if(n.st==='none'){n.filled=false;n.laser=false}
  if(n.by!=='other')n.check='';
  dk.days[k]=n;return n;
}
function lastDone(area){let best='';for(const r of Object.values(dk.days))if(r.area===area&&(r.st==='done')&&r.day>best)best=r.day;return best}
function daysAgo(day){if(!day)return null;const a=new Date(day+'T00:00:00'),b=new Date(today()+'T00:00:00');return Math.round((b-a)/86400000)}
const dsAgo=day=>{const n=daysAgo(day);return n==null?'never':n===0?'today':n===1?'yesterday':n+' days ago'};
/* follow-ups and partial-done areas from earlier days that haven't been done since */
function carriedOver(){
  const latest=new Map();
  for(const r of Object.values(dk.days))if(r.day<today()){const c=latest.get(r.area);if(!c||r.day>c.day)latest.set(r.area,r)}
  const out=[];
  for(const [area,r] of latest){if(r.st!=='follow'&&r.st!=='partly')continue;const t=rec(area);if(t&&t.st==='done')continue;const A=dsArea(area);if(A&&!isSkip(A.id)&&!isSkip(A.dept.id))out.push(r)}
  return out.sort((a,b)=>b.day.localeCompare(a.day));
}
const isTop=id=>!!(dk.cfg.top[id]&&dk.cfg.top[id].on);
function stPill(r){
  if(!r||r.st==='none')return '<span class="pill">Not done</span>';
  const s=r.st==='done'?'<span class="pill Fixed">Done</span>':r.st==='partly'?'<span class="pill Open">Partial</span>':'<span class="pill Needs">Follow-up</span>';
  return s+(r.filled?'<span class="pill dsx">Filled</span>':'')+(r.laser?'<span class="pill dsx">LaserLine</span>':'')+(r.by==='other'?`<span class="pill">${r.check==='missed'?'Others · missed empties':r.check==='good'?'Others · checked':'Done by others'}</span>`:'')
    +(r.st==='follow'&&hasKind(r,'db')&&!r.db?'<span class="pill bad">Delta Buster not submitted</span>':'');
}
const hasKind=(r,kind)=>(r.reasons||[]).some(id=>(dsReason(id)||{}).kind===kind);
const lbl=(L,keys)=>(keys||[]).map(k=>(L.find(x=>x[0]===k)||[,k])[1].toLowerCase()).join(', ');
function reasonText(r){
  const parts=[];
  if(r.st==='partly'&&r.why)parts.push(DS_WHY.find(w=>w[0]===r.why)[1]);
  for(const id of r.reasons||[]){const R=dsReason(id);if(!R)continue;let t=R.name;
    if(R.kind==='db')t+=r.db?` (Delta Buster${r.dbNo?' #'+r.dbNo:''} submitted)`:' (Delta Buster not submitted)';
    if(R.kind==='help'&&r.help.length)t+=` (${lbl(DS_HELP,r.help)})`;
    if(R.kind==='prs'&&r.prsSup.length)t+=` (${lbl(DS_PRS,r.prsSup)})`;
    parts.push(t)}
  let t=parts.join('; ');if(r.note)t+=(t?': ':'')+r.note;return t;
}
/* the follow-up choices, shared by the area sheet and Finish run. s = the area's working state */
function followHtml(s){
  const on=k=>s.reasons.some(id=>(dsReason(id)||{}).kind===k);
  return `<div class="fustack"><div class="chips">${dsReasons().map(R=>`<button type="button" class="chip" data-reason="${R.id}" aria-pressed="${s.reasons.includes(R.id)}">${esc(R.name)}</button>`).join('')}</div>
    ${on('db')?`<div class="rite"><label class="switch"><input type="checkbox" data-db ${s.db?'checked':''}><span>Delta Buster submitted</span></label><input type="text" data-dbno maxlength="40" value="${esc(s.dbNo||'')}" placeholder="Delta Buster number (optional)" aria-label="Delta Buster number"></div>`:''}
    ${on('help')?`<div><span class="label">What's needed <span class="lsub">pick any</span></span><div class="chips">${DS_HELP.map(([k,t])=>`<button type="button" class="chip" data-help="${k}" aria-pressed="${s.help.includes(k)}">${t}</button>`).join('')}</div></div>`:''}
    ${on('prs')?`<div><span class="label">What's short <span class="lsub">pick any</span></span><div class="chips">${DS_PRS.map(([k,t])=>`<button type="button" class="chip" data-prss="${k}" aria-pressed="${s.prsSup.includes(k)}">${t}</button>`).join('')}</div></div>`:''}</div>`;
}
function whyHtml(s){return `<div><span class="label">Why partial</span><div class="chips">${DS_WHY.map(([k,t])=>`<button type="button" class="chip" data-why="${k}" aria-pressed="${s.why===k}">${t}</button>`).join('')}</div></div>`}
/* handles a tap on any follow-up / partial choice; returns true if it changed s */
function followTap(b,s){
  const tog=(a,k)=>a.includes(k)?a.filter(x=>x!==k):[...a,k];
  if(b.dataset.reason){s.reasons=tog(s.reasons,b.dataset.reason);return true}
  if(b.dataset.help){s.help=tog(s.help,b.dataset.help);return true}
  if(b.dataset.prss){s.prsSup=tog(s.prsSup,b.dataset.prss);return true}
  if(b.dataset.why){s.why=s.why===b.dataset.why?'':b.dataset.why;return true}
  return false;
}

/* ---------- the current run (kept on this device) ---------- */
let dsRun=ls.get('roil.dsRun',null);   // {areas:[ids], started}
const saveRun=()=>ls.set('roil.dsRun',dsRun);
let dsFilter=ls.get('roil.dsFilter','all');const dsOpenDepts=new Set();

function renderDs(){
  const el=$('#v-ds');if(!el)return;
  const A=dsAreas(),T=today();
  const recs=A.map(a=>rec(a.id));
  const n={done:0,partly:0,follow:0,none:0};recs.forEach(r=>n[r?r.st:'none']++);
  const pct=A.length?Math.round(n.done/A.length*100):0;
  const top=A.filter(a=>isTop(a.id)&&!(rec(a.id)&&rec(a.id).st==='done'));
  const carried=carriedOver();
  const liftCarry=carried.filter(r=>(r.help||[]).includes('lift'));
  const runSet=new Set(dsRun?dsRun.areas:[]);
  const row=a=>{const r=rec(a.id);const ld=lastDone(a.id);
    return `<button type="button" class="dsrow${runSet.has(a.id)?' inrun':''}" data-area="${a.id}"><span class="dsn">${esc(a.whole?a.name:a.name)}${isTop(a.id)?' <span class="toptag">top stock</span>':''}</span>
      <span class="dsp">${runSet.has(a.id)?'<span class="pill Open">In this run</span>':''}${stPill(r)}</span><span class="dsl muted">${r&&r.st==='done'?'':ld?'Last done '+dsAgo(ld):'Never done'}</span></button>`};
  const want=a=>{const r=rec(a.id),st=r?r.st:'none';return dsFilter==='all'||(dsFilter==='todo'&&st!=='done')||(dsFilter==='follow'&&(st==='follow'||st==='partly'))};
  const byDept=new Map();for(const a of A){if(!byDept.has(a.dept.id))byDept.set(a.dept.id,{d:a.dept,areas:[]});byDept.get(a.dept.id).areas.push(a)}
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Downstock · ${esc(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}))}</h2></div>
  <div class="panel dscov"><div class="covtop"><b>${pct}%</b><span>${n.done} of ${A.length} areas done${n.partly?` · ${n.partly} partial`:''}${n.follow?` · ${n.follow} follow-up`:''}</span></div>
    <div class="covbar"><i class="d" style="width:${A.length?n.done/A.length*100:0}%"></i><i class="p" style="width:${A.length?(n.partly+n.follow)/A.length*100:0}%"></i></div></div>
  ${dsRun?`<div class="panel dsrun"><div><b>Run in progress</b><span class="muted"> · ${dsRun.areas.length} area${dsRun.areas.length===1?'':'s'} · started ${esc(fmtDT(dsRun.started))}</span></div>
      <div class="dsrunlist">${dsRun.areas.map(id=>{const a=dsArea(id);return a?`<span class="chip static">${esc(a.label)}</span>`:''}).join('')}</div>
      <div class="row"><button class="btn primary" type="button" id="dsFinish">Finish run</button><button class="btn" type="button" id="dsAdd">Add areas</button><button class="btn ghost" type="button" id="dsCancel">Cancel run</button></div></div>`
    :`<button class="btn primary big" type="button" id="dsStart">Start a run</button>`}
  ${top.length||liftCarry.length?`<section class="panel lsec dsfirst"><header><h3>Do these first: top stock</h3><span class="muted mono" style="font-size:12px">${top.length+liftCarry.filter(r=>!top.some(a=>a.id===r.area)).length}</span></header>
    <p class="note" style="margin:0">Use the lift before the store opens; once it's open, it needs a spotter.</p>
    <div class="dsrows">${top.map(row).join('')}${liftCarry.filter(r=>!top.some(a=>a.id===r.area)).map(r=>row(dsArea(r.area))).join('')}</div></section>`:''}
  ${carried.length?`<section class="panel lsec"><header><h3>Carried over</h3><span class="muted mono" style="font-size:12px">${carried.length}</span></header>
    <div class="dsrows">${carried.map(r=>{const a=dsArea(r.area);return `<button type="button" class="dsrow" data-area="${a.id}" data-from="${r.day}"><span class="dsn">${esc(a.label)}</span><span class="dsp">${stPill(r)}</span><span class="dsl muted">${esc(dsAgo(r.day))}${reasonText(r)?' · '+esc(reasonText(r)):''}</span></button>`}).join('')}</div></section>`:''}
  <div class="seg" id="dsFilt" role="group" aria-label="Show">${[['all','All'],['todo','Not done'],['follow','Follow-up']].map(([k,t])=>`<button type="button" data-v="${k}" aria-pressed="${dsFilter===k}">${t}</button>`).join('')}</div>
  <div class="lrows">${[...byDept.values()].map(({d,areas})=>{const sh=areas.filter(want);if(!sh.length)return '';const dn=areas.filter(a=>rec(a.id)&&rec(a.id).st==='done').length;
    return `<details class="dept" data-ddept="${d.id}" ${dsOpenDepts.has(d.id)||dsFilter!=='all'?'open':''}><summary>${esc(d.name)}<span class="cnt">${dn}/${areas.length} done</span></summary><div class="dbody dsrows">${sh.map(row).join('')}</div></details>`}).join('')||'<p class="note">Nothing to show with this filter.</p>'}</div>
  <div class="row"><button class="btn small" type="button" id="dsCopy">Copy today's summary for Teams</button></div>`;
  $('#dsFilt').onclick=e=>{const b=e.target.closest('button');if(!b)return;dsFilter=b.dataset.v;ls.set('roil.dsFilter',dsFilter);renderDs()};
  el.querySelectorAll('details[data-ddept]').forEach(x=>x.addEventListener('toggle',()=>{if(x.open)dsOpenDepts.add(x.dataset.ddept);else dsOpenDepts.delete(x.dataset.ddept)}));
  const st=$('#dsStart');if(st)st.onclick=()=>openRunPicker();
  const ad=$('#dsAdd');if(ad)ad.onclick=()=>openRunPicker();
  const ca=$('#dsCancel');if(ca)ca.onclick=e=>{if(e.target.dataset.armed!=='1'){e.target.dataset.armed='1';e.target.textContent='Tap again to cancel';setTimeout(()=>{if(e.target.isConnected){e.target.dataset.armed='';e.target.textContent='Cancel run'}},4000);return}dsRun=null;saveRun();renderDs();toast('Run cancelled. Nothing was marked.')};
  const fi=$('#dsFinish');if(fi)fi.onclick=()=>openRunFinish();
  $('#dsCopy').onclick=()=>copyText(dsSummary(T));
}
$('#v-ds').addEventListener('click',e=>{const r=e.target.closest('.dsrow');if(r)openAreaSheet(r.dataset.area)});

/* ---------- one area: set today's status ---------- */
function openAreaSheet(id){
  const a=dsArea(id);if(!a)return;
  const r0=rec(id)||{st:'none',filled:false,laser:false,reasons:[],help:[],prsSup:[],why:'',db:false,dbNo:'',note:'',by:'me',check:''};
  const s={...r0,reasons:[...(r0.reasons||[])],help:[...(r0.help||[])],prsSup:[...(r0.prsSup||[])]};const prev=carriedOver().find(x=>x.area===id);
  const seg=(k,opts,cur)=>`<div class="seg" data-f="${k}" role="group">${opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join('')}</div>`;
  const paint=()=>{
    $('#asBody').innerHTML=`
      <div><span class="label">Today</span>${seg('st',[['none','Not done'],['partly','Partial'],['done','Done'],['follow','Follow-up']],s.st)}</div>
      ${s.st!=='none'?`<div><span class="label">Extras <span class="lsub">pick any</span></span><div class="chips"><button type="button" class="chip" data-x="filled" aria-pressed="${s.filled}">Filled</button><button type="button" class="chip" data-x="laser" aria-pressed="${s.laser}">LaserLine</button></div></div>
      <div><span class="label">Who did it</span>${seg('by',[['me','Me'],['other','Someone else']],s.by)}</div>
      ${s.by==='other'?`<div><span class="label">Spot-check</span>${seg('check',[['','Not checked'],['good','Looks good'],['missed','Missed empties']],s.check)}${s.check==='missed'?'<p class="note" style="margin:4px 0 0">Missed empties means stock was available but the spot was left empty.</p>':''}</div>`:''}`:''}

/* ---------- days, summary ---------- */
function dsDayStats(day){
  const A=dsAreas(),n={done:0,partly:0,follow:0,filled:0,laser:0,other:0,missed:0,db:0};
  for(const a of A){const r=rec(a.id,day);if(!r)continue;if(r.st!=='none')n[r.st]++;if(r.filled)n.filled++;if(r.laser)n.laser++;if(r.by==='other')n.other++;if(r.check==='missed')n.missed++;if(r.db)n.db++}
  return {...n,total:A.length};
}
function dsSummary(day){
  const A=dsAreas(),s=dsDayStats(day),d=new Date(day+'T12:00:00');
  const L=[`Downstock · ${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}`,`${s.done} of ${s.total} areas done (${s.total?Math.round(s.done/s.total*100):0}%)${s.filled?` · Filled ${s.filled}`:''}${s.laser?` · LaserLine ${s.laser}`:''}`];
  const fol=A.map(a=>({a,r:rec(a.id,day)})).filter(x=>x.r&&x.r.st==='follow');
  if(fol.length)L.push('',`Follow-up (${fol.length}):`,...fol.map(x=>`• ${x.a.label}: ${reasonText(x.r)}`));
  const par=A.map(a=>({a,r:rec(a.id,day)})).filter(x=>x.r&&x.r.st==='partly');
  if(par.length)L.push('',`Partial (${par.length}):`,...par.map(x=>`• ${x.a.label}${reasonText(x.r)?': '+reasonText(x.r):''}`));
  const nd=A.filter(a=>{const r=rec(a.id,day);return !r||r.st==='none'});
  if(nd.length){const g=new Map();for(const a of nd){if(!g.has(a.dept.name))g.set(a.dept.name,[]);if(!a.whole)g.get(a.dept.name).push(a.name)}
    L.push('',`Not done (${nd.length}):`,...[...g].map(([dn,ps])=>`• ${dn}${ps.length>4?` (${ps.length})`:ps.length?': '+ps.join(', '):''}`))}
  if(s.other)L.push('',`Done by others: ${s.other}${s.missed?` (${s.missed} spot-checked with missed empties)`:''}`);
  return L.join('\n');
}

async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that photo'));i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
