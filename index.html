<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Everything stays on this device: the page may only load its own files, and can't send data anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data:; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e6a5a">
<script>/* apply saved appearance before the page draws */try{var a=JSON.parse(localStorage.getItem('roil.appearance')||'null');if(a){var r=document.documentElement;if(a.theme==='light'||a.theme==='dark')r.setAttribute('data-theme',a.theme);['contrast','status','shape','size'].forEach(function(k){if(typeof a[k]==='string')r.setAttribute('data-'+k,a[k])})}}catch(e){}</script>
<title>Retail Operations Issue Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Same reset the Claude artifact skeleton provided */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
/* Layout: single phone-first column (max 760px); fixed bottom tab bar on phones, top tab bar on wide screens. Inspection-tag feel: condensed labels, mono data. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --sunk:#e3e9e6; --ink:#16201c; --muted:#5a6a64; --line:#d3dcd8;
  --accent:#0e6a5a; --accent-ink:#ffffff; --accent-soft:#d5ebe5;
  --open:#a85507; --open-soft:#fbe9d6; --follow:#8a3fb0; --follow-soft:#efe1f6; --good:#1c7443; --good-soft:#dcf0e3; --bad:#b3261e;
  --f-display:"Roboto Condensed",sans-serif-condensed,"Arial Narrow",system-ui,sans-serif;
  --f-body:system-ui,Roboto,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,Consolas,monospace;
  --r:10px;--r-sm:8px;--r-pill:999px;--r-lg:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e4ebe8; --muted:#93a39d; --line:#2b3632;
  --accent:#43b89e; --accent-ink:#04211b; --accent-soft:#18332c;
  --open:#e9a159; --open-soft:#3a2914; --follow:#c99ae3; --follow-soft:#33233d; --good:#62cb8e; --good-soft:#173525; --bad:#f2786e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --sunk:#111816; --ink:#e4ebe8; --muted:#93a39d; --line:#2b3632;
  --accent:#43b89e; --accent-ink:#04211b; --accent-soft:#18332c;
  --open:#e9a159; --open-soft:#3a2914; --follow:#c99ae3; --follow-soft:#33233d; --good:#62cb8e; --good-soft:#173525; --bad:#f2786e;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-size:28px;letter-spacing:.06em;line-height:1}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)} .sync.local i{background:var(--open)}
h2{font-family:var(--f-display);font-size:22px;letter-spacing:.03em;margin:0;text-wrap:balance}
.label{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.stack{display:grid;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:10px 2px 9px;display:grid;justify-items:center;gap:3px;cursor:pointer;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;position:relative;white-space:nowrap}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--open);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
@media (min-width:900px){
  nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);max-width:760px;margin:0 auto;border-radius:0 0 var(--r) var(--r);border-inline:1px solid var(--line)}
  nav.tabs button{grid-auto-flow:column;justify-content:center;align-items:center;gap:8px;padding:12px 4px}
  nav.tabs .badge{position:static;margin-left:-2px}
  body{display:flex;flex-direction:column}
  nav.tabs{order:-1;width:100%}
  .wrap{width:100%}
  .wrap{padding-block:16px 40px}
}

/* capture */
.photo-drop{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r);background:var(--sunk);min-height:150px;cursor:pointer;text-align:center;padding:16px;position:relative;overflow:hidden}
.photo-drop svg{width:40px;height:40px;stroke:var(--accent);fill:none;stroke-width:1.6}
.photo-drop strong{font-family:var(--f-display);font-size:20px;letter-spacing:.04em}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo-drop.has{padding:0;border-style:solid;min-height:0}
.photo-drop.has img{display:block;width:100%;max-height:340px;object-fit:cover}
.photo-tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:14px}
.when{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
select,input[type=text],input[type=search],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;min-height:46px}
textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.two.collapse{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-pill);padding:8px 13px;cursor:pointer;font-size:15px;line-height:1.2;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:11px 6px;cursor:pointer;font-weight:500;min-height:46px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg.status button[data-v="Fixed"][aria-pressed="true"]{background:var(--good);color:var(--surface)}
.seg.status button[data-v="Open"][aria-pressed="true"]{background:var(--open);color:var(--surface)}
.seg.status button[data-v="Needs follow-up"][aria-pressed="true"]{background:var(--follow);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;min-height:56px}
.btn.small{min-height:36px;padding:6px 11px;font-size:14px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn:disabled{opacity:.55;cursor:default}
.req{color:var(--bad);font-size:13px;font-family:var(--f-body);text-transform:none;letter-spacing:0;margin-left:6px}

/* items */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.item .thumb{width:64px;height:64px;border-radius:6px;background:var(--sunk);object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono);font-size:10px}
.item .body{min-width:0;display:grid;gap:3px}
.item .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .s{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:4px;padding:2px 6px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.pill.Open{background:var(--open-soft);color:var(--open)}
.pill.Needs{background:var(--follow-soft);color:var(--follow)}
.pill.Fixed{background:var(--good-soft);color:var(--good)}
.age{font-family:var(--f-mono);font-size:12px;color:var(--open)}
.fu{display:grid;gap:8px}
.fu .actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:20px;letter-spacing:.03em}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.filters .wide{grid-column:1/-1}
@media (min-width:640px){.filters{grid-template-columns:repeat(4,1fr)}}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:700}
.tile .k{font-size:13px;color:var(--muted)}
.tile.warn .v{color:var(--open)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 2.6em;gap:10px;align-items:center;font-size:14px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden;display:flex}
.bar .bt i{display:block;height:100%;background:var(--accent)}
.bar .bt i.o{background:var(--open)}
.bar .bn{font-family:var(--f-mono);font-size:13px;text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.trend{display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:1px solid var(--line);padding-top:16px}
.trend .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.trend .c i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px}
.trend .c b{font-family:var(--f-mono);font-size:10px;font-weight:400;color:var(--muted);position:absolute;top:-14px}
.tlabels{display:flex;gap:4px;margin-top:4px}
.tlabels span{flex:1;font-family:var(--f-mono);font-size:10px;color:var(--muted);text-align:center;min-width:0;overflow:hidden;white-space:nowrap}
.hot{display:grid;gap:6px}
.hot div{display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:baseline;font-size:15px}
.hot b{font-family:var(--f-mono);font-weight:500;color:var(--open);text-align:right}
.insight{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.stats-grid{display:grid;gap:12px}
@media (min-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
.stats-grid .full{grid-column:1/-1}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:var(--r-lg);max-height:88%}}
.sheet img{width:100%;border-radius:var(--r-sm);max-height:420px;object-fit:contain;background:var(--sunk)}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:15px}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
@media (min-width:900px){.toast{bottom:24px}}
.note{font-size:14px;color:var(--muted)}
.banner{background:var(--open-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
code.ex{font-family:var(--f-mono);font-size:12px;background:var(--sunk);padding:1px 4px;border-radius:3px}
.lsec{display:grid;gap:10px}
.lsec>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lsec h3{font-family:var(--f-display);font-size:19px;letter-spacing:.03em;margin:0}
.lrows{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 40px;gap:4px;align-items:center}
.lrow input[type=text],.ladd input[type=text]{min-height:42px;padding:8px 10px}
.ib{width:40px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;padding:0}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.3;cursor:default}
.ib.del{color:var(--bad)}
.ib.del.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ladd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
details.dept{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
details.dept>summary{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;list-style:none}
details.dept>summary::-webkit-details-marker{display:none}
details.dept>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-left:4px}
details.dept[open]>summary::after{transform:rotate(-135deg)}
details.dept>summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
details.dept[open]>summary{border-bottom:1px solid var(--line)}
.dbody{padding:12px;display:grid;gap:12px;background:var(--bg);border-radius:0 0 var(--r-sm) var(--r-sm)}
.switch{display:flex;align-items:center;gap:12px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.saving{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* Wider screens: more room for lists, the form stays readable */
@media (min-width:1000px){
  .wrap{max-width:1120px}
  nav.tabs{max-width:1120px}
  #v-log,#v-lists{max-width:680px;width:100%;margin-inline:auto}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .sheet{max-width:820px}
}
@media (min-width:1400px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
.photo-drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.banner .btn{flex:none}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

button.sync{border:0;background:none;cursor:pointer;padding:6px 0}
.pk{display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* ---------- Appearance settings (Lists → Appearance). Set as attributes on <html>. ---------- */
:root[data-shape="soft"]{--r:6px;--r-sm:5px;--r-pill:8px;--r-lg:8px}
:root[data-shape="square"]{--r:2px;--r-sm:2px;--r-pill:2px;--r-lg:2px}
:root[data-size="compact"] body{zoom:.9}
:root[data-size="large"] body{zoom:1.15}
/* High contrast: pure backgrounds, darker text and much stronger outlines */
:root[data-contrast="high"]{--bg:#ffffff;--surface:#ffffff;--sunk:#eef1f0;--ink:#000000;--muted:#2b3632;--line:#6b7c76}
@media (prefers-color-scheme: dark){:root[data-contrast="high"]:not([data-theme="light"]){--bg:#000000;--surface:#0b100e;--sunk:#141b18;--ink:#ffffff;--muted:#d3ddd9;--line:#7f918a}}
:root[data-contrast="high"][data-theme="dark"]{--bg:#000000;--surface:#0b100e;--sunk:#141b18;--ink:#ffffff;--muted:#d3ddd9;--line:#7f918a}
:root[data-contrast="high"] :focus-visible{outline-width:3px}
:root[data-contrast="high"] .chip,:root[data-contrast="high"] .btn,:root[data-contrast="high"] .seg,:root[data-contrast="high"] .item,:root[data-contrast="high"] .panel{border-width:2px}
/* Color-blind friendly statuses: orange / blue / slate instead of orange / purple / green */
:root[data-status="cb"]{--open:#b84f00;--open-soft:#fde6d4;--follow:#1f5fbf;--follow-soft:#dde8fa;--good:#3d4f5c;--good-soft:#e1e7eb}
@media (prefers-color-scheme: dark){:root[data-status="cb"]:not([data-theme="light"]){--open:#ff9e57;--open-soft:#3d2510;--follow:#8ab4ff;--follow-soft:#1a2a45;--good:#c2ced6;--good-soft:#27323a}}
:root[data-status="cb"][data-theme="dark"]{--open:#ff9e57;--open-soft:#3d2510;--follow:#8ab4ff;--follow-soft:#1a2a45;--good:#c2ced6;--good-soft:#27323a}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.swc{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--muted)}
.swc input{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;padding:2px;background:var(--surface);cursor:pointer}
.lsec>header .btn{margin-left:auto}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>ROIL</b><span>Retail Operations Issue Log</span></div>
    <button class="sync" id="sync" type="button"><i></i><span>Starting…</span></button>
  </header>
  <div id="banner"></div>

  <!-- LOG -->
  <section id="v-log" class="stack">
    <div>
      <label class="photo-drop" id="photoDrop" for="photoIn">
        <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h2l1.5-2h6l1.5 2h2A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg>
        <strong>Take photo</strong>
        <span class="muted" style="font-size:14px">Opens your camera</span>
        <input id="photoIn" type="file" accept="image/*" capture="environment">
      </label>

<script>
'use strict';
/* ---------- defaults ---------- */
const DEFAULT_LISTS = {
  departments: [

    ["TV & Home Theater",["TVs","OLED TVs","QLED TVs","LED TVs","Projectors","Streaming Devices","TV Accessories","TV Mounts","Cables","Home Theater Systems"]],
    ["Home Audio",["Soundbars","AV Receivers","Speakers","Wireless Speakers","Headphones","Earbuds","Turntables","Audio Accessories"]],
    ["Cameras & Camcorders",["DSLR Cameras","Mirrorless Cameras","Point-and-Shoot Cameras","Camera Lenses","Camcorders","Camera Accessories","Memory Cards","Drones"]],

    ["Car Electronics & GPS",["Car Stereos","Car Speakers","Subwoofers","Amplifiers","GPS & Navigation","Dash Cams","Radar Detectors","Remote Starters","Backup Cameras","Car Accessories"]],
    ["Smart Home",["Smart Lights","Smart Plugs","Smart Switches","Smart Speakers","Smart Displays","Smart Thermostats","Smart Locks","Video Doorbells","Smart Cameras","Smart Sensors","Home Automation"]],
    ["Security & Wi-Fi",["Security Cameras","Video Doorbells","Mesh Wi-Fi","Routers","Wi-Fi Extenders","Network Equipment","Network Accessories"]],
    ["Major Appliances",["Refrigerators","Freezers","Dishwashers","Ranges","Cooktops","Wall Ovens","Microwaves","Washers","Dryers","Laundry Accessories","Appliance Accessories"]],
    ["Small Appliances",["Coffee Makers","Espresso Machines","Blenders","Air Fryers","Toasters","Mixers","Food Processors","Vacuums","Air Purifiers","Fans","Air Conditioners","Kitchen Appliances"]],
    ["Home, Furniture & Office",["Desks","Office Chairs","Furniture","Home Office Equipment","Shelving & Storage","Mattresses & Sleep Products","Office Accessories"]],
    ["Health, Wellness & Personal Care",["Electric Toothbrushes","Water Flossers","Shavers","Hair Care","Hair Clippers","Massage Devices","Health Monitoring","Fitness Equipment","Wellness Products"]],
    ["Fitness, Sports & Outdoors",["Exercise Equipment","Fitness Trackers","Bicycles","Outdoor Technology","Sports Electronics","Outdoor Accessories"]],
    ["Electric Transportation",["Electric Bikes","Electric Scooters","EV Chargers","Electric Transportation Accessories"]],
    ["Toys, Games & Crafts",["Toys","Board Games","STEM Toys","LEGO","Craft Products","Building Sets","Kids' Electronics"]],
    ["Collectibles & Memorabilia",["Trading Cards","Pokémon","Sports Memorabilia","Pop-Culture Collectibles","Action Figures","Collectible Figures"]],
    ["Services / Geek Squad",["Computer Setup","Computer Repair","Device Setup","TV Installation","Home Theater Installation","Appliance Installation","Networking Services","Data Services","Protection Plans","Tech Support"]],
    ["Best Buy Outlet",["Open-Box Products","Clearance Products","Refurbished Products","Returned Merchandise"]]
  ],
  issues:["Wrong facing / placement","Overstuffed","Mixed product","Missing ESL","ESL not paired","Item in wrong location","RITE","Damaged product or fixture","Not per planogram","Missing signage","Safety / security concern"],
  causes:["Outdated planogram","Training / process gap","Planogram not followed","Customer left item out","Display not maintained","Stock not on hand","Missed or late reset","Unknown"],
  shifts:["Opening","Mid","Closing"],
  showShift:false
};
const STATUSES=["Fixed","Open","Needs follow-up"];

/* ---------- helpers ---------- */
const dev=(()=>{const ua=navigator.userAgent;const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua);let coarse=false;try{coarse=matchMedia('(pointer:coarse)').matches}catch(e){}
  return {ios,android,mobile:ios||android||coarse}})();
const standalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
/* ---------- appearance ---------- */
const AP_DEFAULT={theme:'auto',contrast:'normal',accent:'#0e6a5a',status:'default',shape:'rounded',size:'normal',updated:''};
const AP_OPTS={theme:['auto','light','dark'],contrast:['normal','high'],status:['default','cb'],shape:['rounded','soft','square'],size:['compact','normal','large']};
const ACCENTS=[['Teal','#0e6a5a'],['Blue','#1d5fbf'],['Indigo','#4b4fc4'],['Plum','#7b3f9e'],['Red','#b3261e'],['Orange','#b4530b'],['Green','#2e7d32'],['Graphite','#3d4650']];
function cleanAp(a){
  const o={...AP_DEFAULT};
  if(a&&typeof a==='object'){
    for(const k in AP_OPTS)if(AP_OPTS[k].includes(a[k]))o[k]=a[k];
    if(/^#[0-9a-f]{6}$/i.test(a.accent||''))o.accent=a.accent.toLowerCase();
    if(typeof a.updated==='string')o.updated=a.updated.slice(0,40);
  }
  return o;
}
/* Any accent stays readable: it's darkened or lightened until it contrasts with the surfaces
   it sits on, and button text switches between white and near-black as needed. */
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgbHex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const lum=h=>{const c=hexRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const contrastRatio=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const mixHex=(a,b,t)=>{const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t))};
function fitHex(c,bg,target,toward){for(let i=0;i<25&&contrastRatio(c,bg)<target;i++)c=mixHex(c,toward,.12);return c}
function accentVars(hex){
  const l=fitHex(hex,'#ffffff',3.2,'#000000'),d=fitHex(hex,'#18201d',4.2,'#ffffff');
  return {l,li:contrastRatio(l,'#ffffff')>=4.5?'#ffffff':'#0b0f0d',ls:mixHex(l,'#ffffff',.84),
          d,di:contrastRatio(d,'#ffffff')>=4.5?'#ffffff':'#06120f',ds:mixHex(d,'#18201d',.75)};
}
let ap={...AP_DEFAULT};   // loaded from this device's storage just below the storage helper
function applyAp(){
  const r=document.documentElement;
  if(ap.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',ap.theme);
  for(const k of['contrast','status','shape','size'])r.setAttribute('data-'+k,ap[k]);
  let st=document.getElementById('apStyle');
  if(!st){st=document.createElement('style');st.id='apStyle';document.head.appendChild(st)}
  if(ap.accent===AP_DEFAULT.accent)st.textContent='';
  else{const v=accentVars(ap.accent);const L=`--accent:${v.l};--accent-ink:${v.li};--accent-soft:${v.ls}`,D=`--accent:${v.d};--accent-ink:${v.di};--accent-soft:${v.ds}`;
    st.textContent=`:root{${L}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${D}}}:root[data-theme="dark"]{${D}}`}
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=ap.accent;
}
function setAp(patch,save=true){
  ap=cleanAp({...ap,...patch,updated:new Date().toISOString()});
  if(save)ls.set('roil.appearance',ap);
  applyAp();
}
const installHint=()=>dev.ios?'in Safari, tap Share → Add to Home Screen':dev.android?'in the Chrome menu, tap Add to home screen':'use the install icon in the address bar, or the browser menu → Install ROIL';
const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
ap=cleanAp(ls.get('roil.appearance',null));applyAp();
const fmtDT=iso=>{const d=new Date(iso);return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
const fmtD=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
function age(iso){const m=(Date.now()-new Date(iso))/60000;if(m<60)return Math.max(1,Math.round(m))+' min';const h=m/60;if(h<24)return Math.round(h)+' h';return Math.round(h/24)+' d'}
function dur(ms){const h=ms/3600000;if(h<1)return Math.round(ms/60000)+' min';if(h<48)return h.toFixed(1)+' h';return (h/24).toFixed(1)+' d'}
const pillCls=s=>s==='Needs follow-up'?'Needs':s;
const newId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function normLists(d){
  const l=JSON.parse(JSON.stringify(DEFAULT_LISTS));
  if(!d)return l;
  if(Array.isArray(d.departments)&&d.departments.length)l.departments=d.departments.map(x=>{if(Array.isArray(x))return [String(x[0]),Array.isArray(x[1])?x[1].map(String):[]];const p=x.planograms||x.subs;return [String(x.name),Array.isArray(p)?p.map(String):[]]});
  l.showShift=d.showShift===true;
  l.updated=typeof d.updated==='string'?d.updated:'';
  for(const k of['issues','causes','shifts'])if(Array.isArray(d[k])&&d[k].length)l[k]=d[k].map(String);
  return l;
}

/* ---------- state ---------- */
let items=[];            // newest first
let lists=normLists(null);
let loaded=false;
let view='log';
let hf=ls.get('roil.hf',{range:'30',dept:'',issue:'',status:'',q:''});
let srange=ls.get('roil.srange','30');
const form={photoFile:null,photoUrl:null,dept:'',sub:'',issue:'',cause:'',status:'Fixed',shift:''};
const last=ls.get('roil.last',{});
form.dept=last.dept||'';form.sub=last.sub||'';form.shift=last.shift||'';
const photoUrls=new Map(),thumbUrls=new Map();   // item id -> blob: URL for photos kept on this device

/* ---------- local database (IndexedDB, only on this device) ---------- */
let idbP=null;
function idb(){
  if(!idbP)idbP=new Promise((res,rej)=>{const r=indexedDB.open('roil',1);
    r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'});d.createObjectStore('outbox',{keyPath:'seq',autoIncrement:true});d.createObjectStore('meta')};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
  return idbP;
}
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const done=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error)});
async function getAll(s){const d=await idb();return rq(d.transaction(s).objectStore(s).getAll())}
async function getOne(s,k){const d=await idb();return rq(d.transaction(s).objectStore(s).get(k))}
/* ops: [{s:store, v:value, k?:key} | {s:store, del:key}] in one atomic transaction */
async function write(ops){
  const d=await idb();const t=d.transaction([...new Set(ops.map(o=>o.s))],'readwrite');
  for(const o of ops){const st=t.objectStore(o.s);if('del' in o)st.delete(o.del);else if(o.k!==undefined)st.put(o.v,o.k);else st.put(o.v)}
  return done(t);
}

function setItems(arr){items=arr.slice().sort((a,b)=>b.created<a.created?-1:1);renderAll()}
function upsertLocal(n){setItems(items.filter(x=>x.id!==n.id).concat(n))}
function dropLocal(id){
  for(const m of[photoUrls,thumbUrls]){const u=m.get(id);if(u){URL.revokeObjectURL(u);m.delete(id)}}
  setItems(items.filter(x=>x.id!==id));
}
const ITEM_FIELDS=['id','created','updated','dept','planogram','issue','cause','shift','note','status','fixedAt','photo'];
function serverItem(it){const o={};for(const k of ITEM_FIELDS)o[k]=it[k]??(k==='fixedAt'?null:k==='photo'?false:'');o.photo=!!o.photo;return o}
function listsBody(l){return {departments:l.departments.map(([n,s])=>({name:n,planograms:s})),issues:l.issues,causes:l.causes,shifts:l.shifts,showShift:!!l.showShift,updated:l.updated||''}}

const store={
  async put(item,photo){
    const ops=[{s:'items',v:item}];
    if(photo)ops.push({s:'photos',v:{id:item.id,full:photo.full,thumb:photo.thumb}});
    await write(ops);
    if(photo){photoUrls.set(item.id,URL.createObjectURL(photo.full));thumbUrls.set(item.id,URL.createObjectURL(photo.thumb))}
    upsertLocal(item);
  },
  async patch(id,p){
    const it=items.find(i=>i.id===id);if(!it)return;
    const n={...it,...p,updated:new Date().toISOString()};
    await write([{s:'items',v:n}]);
    upsertLocal(n);
  },
  async remove(it){
    tombs[it.id]=new Date().toISOString();
    await write([{s:'items',del:it.id},{s:'photos',del:it.id},{s:'meta',v:tombs,k:'deleted'}]);
    dropLocal(it.id);
  },
  async saveLists(l){
    l.updated=new Date().toISOString();
    await write([{s:'meta',v:listsBody(l),k:'lists'}]);
  }
};

/* ---------- backup, restore & storage status ---------- */
let tombs={};   // id -> time deleted, so merging a backup from another device doesn't bring deleted issues back
let lastBackup=ls.get('roil.lastBackup',null);   // ISO time of the last backup file made on this device
let store_={persisted:null,usage:null,quota:null};
async function refreshStorage(){
  try{store_.persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null}catch(e){}
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();store_.usage=e.usage;store_.quota=e.quota}}catch(e){}
  setSync();if(view==='lists')renderLists();
}
const fmtMB=b=>b==null?'?':b<1048576?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(b<10485760?1:0)+' MB';
function backupAgeDays(){return lastBackup?(Date.now()-new Date(lastBackup))/86400000:Infinity}
function setSync(){
  const el=$('#sync');const d=backupAgeDays();const stale=items.length&&d>7;
  el.className='sync '+(stale?'local':'on');
  $('span',el).textContent=!loaded?'Starting…':!items.length?'On this device':lastBackup?`Backed up ${d<1?'today':Math.round(d)+' d ago'}`:'No backup yet';
  let msg='',canHide=false;
  if(items.length&&!standalone()){
    if(dev.ios)msg='On iPhone and iPad, Safari erases ROIL\'s data if you don\'t open it for 7 days. To keep it, '+installHint()+'.';
    else if(store_.persisted===false&&!ls.get('roil.hideInstall',false)){msg='Your browser may clear ROIL\'s data if this device runs low on space. To keep it, '+installHint()+'.';canHide=true}
  }
  $('#banner').innerHTML=msg?`<div class="banner"><span>${esc(msg)}</span>${canHide?'<button class="btn small" id="hideInstall" type="button">Got it</button>':''}</div>`:'';
  const h=$('#hideInstall');if(h)h.onclick=()=>{ls.set('roil.hideInstall',true);setSync()};
}
$('#sync').addEventListener('click',()=>setView('lists'));

async function blobToB64(b){const d=await blobToDataUrl(b);return d.slice(d.indexOf(',')+1)}
function b64ToBlob(s,type){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type})}
/* One JSON file with every issue, your lists and all photos. Built in parts so a big log
   doesn't need one giant string. Same item format the server version uses. */
async function buildBackup(){
  const [its,phs,l]=await Promise.all([getAll('items'),getAll('photos'),getOne('meta','lists')]);
  const parts=[`{"format":"roil-backup","version":1,"exported":${JSON.stringify(new Date().toISOString())},"lists":${JSON.stringify(l||null)},"deleted":${JSON.stringify(tombs)},"appearance":${JSON.stringify(ap)},"items":${JSON.stringify(its)},"photos":{`];
  let first=true;
  for(const p of phs){
    parts.push(`${first?'':','}${JSON.stringify(p.id)}:{"full":"${await blobToB64(p.full)}","thumb":"${await blobToB64(p.thumb)}"}`);first=false;
  }
  parts.push('}}');
  return {blob:new Blob(parts,{type:'application/json'}),count:its.length,photos:phs.length};
}
const backupName=()=>`ROIL backup ${localDay(new Date())}.json`;
async function doBackup(shareIt){
  toast('Making backup…');
  try{
    const b=await buildBackup();
    if(shareIt){
      const f=new File([b.blob],backupName(),{type:'application/json'});
      if(!(navigator.canShare&&navigator.canShare({files:[f]}))){toast('This device can\'t share the backup file. Use Download backup instead.');return}
      await navigator.share({files:[f],title:'ROIL backup'});
    }else save(backupName(),b.blob);
    lastBackup=new Date().toISOString();ls.set('roil.lastBackup',lastBackup);setSync();if(view==='lists')renderLists();
    toast(`Backup ${shareIt?'shared':'saved'}: ${b.count} issue${b.count===1?'':'s'}, ${b.photos} photo${b.photos===1?'':'s'}.`);
  }catch(e){if(e&&e.name==='AbortError')return;toast('Couldn\'t make the backup. Try again.')}
}
/* Restore merges: an issue in the file replaces the one here only if it was edited more recently.
   Deletions travel too: an issue deleted on either device stays deleted, unless it was edited after the deletion. */
async function doRestore(file){
  let data;
  try{data=JSON.parse(await file.text())}catch(e){toast('That file isn\'t a ROIL backup.');return}
  if(!data||data.format!=='roil-backup'||!Array.isArray(data.items)){toast('That file isn\'t a ROIL backup.');return}
  const ID=/^[a-z0-9]{6,40}$/;const have=new Map(items.map(i=>[i.id,i]));const ops=[];let added=0,updated=0,photos=0,removed=0;
  const newTombs={...tombs};
  if(data.deleted&&typeof data.deleted==='object'){
    for(const [id,t] of Object.entries(data.deleted)){
      if(!ID.test(id)||typeof t!=='string'||t.length>40)continue;
      if(!newTombs[id]||t>newTombs[id])newTombs[id]=t;
      const cur=have.get(id);
      if(cur&&cur.updated<=t){ops.push({s:'items',del:id},{s:'photos',del:id});have.delete(id);removed++;
        for(const m of[photoUrls,thumbUrls]){const u=m.get(id);if(u){URL.revokeObjectURL(u);m.delete(id)}}}
    }
  }
  for(const x of data.items){
    if(!x||typeof x!=='object'||!ID.test(x.id||'')||typeof x.dept!=='string'||typeof x.issue!=='string'||!STATUSES.includes(x.status))continue;
    const it={};for(const k of ITEM_FIELDS)it[k]=x[k]??(k==='fixedAt'?null:k==='photo'?false:'');it.photo=!!it.photo;
    for(const k of['dept','planogram','issue','cause','shift','created','updated'])it[k]=String(it[k]).slice(0,120);
    it.note=String(it.note).slice(0,2000);
    const cur=have.get(it.id);
    if(cur&&cur.updated>=it.updated)continue;
    if(newTombs[it.id]&&newTombs[it.id]>=it.updated)continue;   // deleted after this version was saved
    ops.push({s:'items',v:it});have.set(it.id,it);cur?updated++:added++;
    const p=data.photos&&data.photos[it.id];
    if(it.photo&&p&&typeof p.full==='string'){
      try{const full=b64ToBlob(p.full,'image/jpeg');const thumb=typeof p.thumb==='string'?b64ToBlob(p.thumb,'image/jpeg'):full;
        ops.push({s:'photos',v:{id:it.id,full,thumb}});photos++;
        for(const m of[photoUrls,thumbUrls]){const u=m.get(it.id);if(u)URL.revokeObjectURL(u)}
        photoUrls.set(it.id,URL.createObjectURL(full));thumbUrls.set(it.id,URL.createObjectURL(thumb));
      }catch(e){}
    }
  }
  if(data.lists&&Array.isArray(data.lists.departments)&&(data.lists.updated||'')>(lists.updated||'')){
    lists=normLists(data.lists);ops.push({s:'meta',v:listsBody(lists),k:'lists'});buildForm();
  }
  let apChanged=false;
  if(data.appearance&&typeof data.appearance==='object'){const inc=cleanAp(data.appearance);if((inc.updated||'')>(ap.updated||'')){ap=inc;ls.set('roil.appearance',ap);applyAp();apChanged=true}}
  ops.push({s:'meta',v:newTombs,k:'deleted'});
  try{await write(ops)}catch(e){toast(e&&e.name==='QuotaExceededError'?'Not enough space on this device to restore.':'Couldn\'t restore. Try again.');return}
  tombs=newTombs;
  setItems([...have.values()]);
  const bits=[];if(added)bits.push(`${added} new`);if(updated)bits.push(`${updated} updated`);if(removed)bits.push(`${removed} removed`);if(apChanged)bits.push('appearance settings');
  toast(bits.length?`Merged backup: ${bits.join(', ')}${added||updated?` (${photos} photo${photos===1?'':'s'})`:''}.`:'Nothing new in that backup. Your log already has everything in it.');
}

    for(const p of phs){photoUrls.set(p.id,URL.createObjectURL(p.full));thumbUrls.set(p.id,URL.createObjectURL(p.thumb))}
    if(l)lists=normLists(l);

  }catch(e){loaded=true;renderAll();toast('Your browser won\'t let ROIL store data. Make sure you\'re not in a private or Incognito window.')}

async function compress(file,max,q){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that photo'));i.src=url});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',q));
  }finally{URL.revokeObjectURL(url)}
}
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});

/* Share menu: photo + text together. The text is also put on the clipboard first,
   so if Teams drops it you can paste it into the comment box. Pass a file promise
   that was started earlier, so the tap's permission to share doesn't time out. */
async function shareItem(it,fileP){
  const text=cardText(it);
  let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(e){}
  if(!navigator.share){toast(copied?'This browser can\'t open the share menu. The details are copied.':'This browser can\'t open the share menu.');return}
  const file=fileP?await fileP.catch(()=>null):null;
  const data={title:`ROIL · ${it.issue}`,text};
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))data.files=[file];
  try{await navigator.share(data);if(copied)toast('Shared. If the text didn\'t come through, paste it. It\'s on your clipboard.')}
  catch(e){if(e&&e.name==='AbortError')return;toast(copied?'Couldn\'t open the share menu. The details are copied, so use Copy photo too.':'Couldn\'t open the share menu.')}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into Teams.')}
  catch(e){showCopyFallback(t)}
}
function showCopyFallback(t){
  openSheet(`<div class="head"><h2>Copy this text</h2><button class="btn small" data-close>Close</button></div><p class="note">Copying was blocked. Select the text below, copy it, then paste into Teams.</p><textarea id="cpy" style="min-height:200px" readonly>${esc(t)}</textarea>`);
  const ta=$('#cpy');ta.focus();ta.select();
}
function cardHtml(it,dataUrl){
  const rows=cardText(it).split('\n');
  return `<div>${dataUrl?`<img src="${dataUrl}" width="480" alt="Issue photo"><br>`:''}<b>${esc(rows[0])}</b><br>${rows.slice(1).map(esc).join('<br>')}</div>`;
}
function toPng(blob){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();
    i.onload=()=>{const sc=Math.min(1,1280/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*sc);c.height=Math.round(i.naturalHeight*sc);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u});
}
const canCopyImages=()=>!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);
/* Photo + details in one copy: plain text, formatted text with the photo, and the photo alone.
   Built inside the tap with the image parts as promises; falls back to text only. */
async function copyItem(it){
  if(!it)return;
  const text=cardText(it);
  if(!it.photo||!canCopyImages())return copyText(text);
  try{
    const jpg=photoFile(it);
    const item=new ClipboardItem({
      'text/plain':new Blob([text],{type:'text/plain'}),
      'text/html':jpg.then(blobToDataUrl).then(d=>new Blob([cardHtml(it,d)],{type:'text/html'})),
      'image/png':jpg.then(toPng)
    });
    await navigator.clipboard.write([item]);
    toast('Copied photo and details. Paste into Teams.');
  }catch(e){
    try{await navigator.clipboard.writeText(text);toast('Copied the details only. Use Copy photo or Share for the picture.')}
    catch(e2){showCopyFallback(text)}
  }
}
async function copyPhoto(it){
  if(!it.photo)return;
  if(!canCopyImages()){toast('This browser can\'t copy photos. Use Share instead.');return}
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':photoFile(it).then(toPng)})]);toast('Copied the photo. Paste it into Teams.')}
  catch(e){toast('Copying the photo was blocked. Use Share instead.')}
}

function countBy(arr,fn){const m=new Map();for(const it of arr){const k=fn(it)||'Not set';m.set(k,(m.get(k)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])}
function openBy(arr,fn){const m=new Map();for(const it of arr)if(it.status!=='Fixed'){const k=fn(it)||'Not set';m.set(k,(m.get(k)||0)+1)}return m}
function bars(entries,openMap,limit=12){
  if(!entries.length)return '<p class="note">No data in this range.</p>';
  const max=entries[0][1];
  return `<div class="bars">${entries.slice(0,limit).map(([k,v])=>{const o=openMap?openMap.get(k)||0:0;return `<div class="bar"><span class="bl" title="${esc(k)}">${esc(k)}</span><span class="bt"><i style="width:${(v-o)/max*100}%"></i>${o?`<i class="o" style="width:${o/max*100}%"></i>`:''}</span><span class="bn">${v}</span></div>`}).join('')}</div>`;
}
function trend(arr,r){
  const daily=r==='1'||r==='7'||r==='30';const n=r==='1'?1:r==='7'?7:r==='30'?30:12;
  const buckets=[];const today=new Date();today.setHours(0,0,0,0);
  if(daily){for(let i=n-1;i>=0;i--){const s=new Date(today);s.setDate(s.getDate()-i);const e=new Date(s);e.setDate(e.getDate()+1);buckets.push({s,e,label:r==='30'?String(s.getDate()):s.toLocaleDateString(undefined,{weekday:'short'})})}}
  else{const ws=new Date(today);ws.setDate(ws.getDate()-ws.getDay());for(let i=n-1;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);buckets.push({s,e,label:fmtD(s)})}}
  for(const b of buckets)b.v=arr.filter(it=>{const d=new Date(it.created);return d>=b.s&&d<b.e}).length;
  const max=Math.max(1,...buckets.map(b=>b.v));
  const step=buckets.length>14?5:1;
  return `<div class="trend">${buckets.map(b=>`<div class="c" title="${esc(b.label)}: ${b.v}">${b.v&&buckets.length<=14?`<b style="bottom:${b.v/max*100}%;top:auto;transform:translateY(-2px)">${b.v}</b>`:''}<i style="height:${b.v/max*100}%"></i></div>`).join('')}</div>
  <div class="tlabels">${buckets.map((b,i)=>`<span>${(buckets.length-1-i)%step===0?esc(b.label):''}</span>`).join('')}</div>
  <p class="note" style="margin:6px 0 0">${daily?'Issues logged per day':'Issues logged per week (week starting)'}</p>`;
}
function renderStats(){
  const el=$('#v-stats');const r=srange;const arr=items.filter(it=>inRange(it,r));
  const open=items.filter(i=>i.status!=='Fixed').length;
  const fixed=arr.filter(i=>i.status==='Fixed'&&i.fixedAt);
  const spot=fixed.filter(i=>new Date(i.fixedAt)-new Date(i.created)<10*60000).length;
  const later=fixed.map(i=>new Date(i.fixedAt)-new Date(i.created)).filter(ms=>ms>=10*60000).sort((a,b)=>a-b);
  const med=later.length?later[Math.floor(later.length/2)]:null;
  const combos=countBy(arr,i=>`${i.dept}${i.planogram?' › '+i.planogram:''} · ${i.issue}`).filter(x=>x[1]>1).slice(0,8);
  const pogs=countBy(arr.filter(i=>i.planogram),i=>`${i.planogram.trim()} (${i.dept})`).filter(x=>x[1]>1).slice(0,8);
  const causes=countBy(arr,i=>i.cause);
  const coach=arr.filter(i=>i.cause==='Training / process gap'||i.cause==='Planogram not followed');

  const coachShift=lists.showShift&&countBy(coach.filter(i=>i.shift),i=>i.shift)[0];
  let insight='';

    const top=countBy(arr,i=>i.issue)[0];const topD=countBy(arr,i=>i.dept)[0];
    insight=`<div class="insight"><b>${esc(top[0])}</b> is the most common issue (${top[1]} of ${arr.length}). <b>${esc(topD[0])}</b> has the most issues overall (${topD[1]}).${coach.length?` ${coach.length} issue${coach.length===1?' points':'s point'} to training or planogram not being followed${coachIssues.length?', mostly '+coachIssues.map(c=>esc(c[0]).toLowerCase()).join(', '):''}${coachShift&&coachShift[1]>1?`, most often on ${esc(coachShift[0].toLowerCase())} shift`:''}.`:''}</div>`;
  }
  el.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Stats</h2><select id="sRange" style="width:auto" aria-label="Date range">${rangeOpts(r)}</select></div>
  ${!items.length?emptyState(!loaded?'Loading your log…':'No stats yet','Once you log a few issues, this shows what goes wrong most, where it happens, and what\'s causing it.'):`
  <div class="tiles">
    <div class="tile"><span class="v">${arr.length}</span><span class="k">Issues logged</span></div>
    <div class="tile ${open?'warn':''}"><span class="v">${open}</span><span class="k">Open now (all time)</span></div>
    <div class="tile"><span class="v">${fixed.length?Math.round(spot/fixed.length*100)+'%':'–'}</span><span class="k">Fixed on the spot</span></div>
    <div class="tile"><span class="v" style="font-size:${med?'28px':'34px'}">${med?dur(med):'–'}</span><span class="k">Median time to fix later</span></div>
  </div>
  ${insight}
  <div class="stats-grid">
    <div class="panel full"><span class="label">Trend</span>${trend(arr,r)}</div>
    <div class="panel"><span class="label">By issue</span>${bars(countBy(arr,i=>i.issue),openBy(arr,i=>i.issue))}<div class="legend"><span><i style="background:var(--accent)"></i>Fixed</span><span><i style="background:var(--open)"></i>Still open</span></div></div>
    <div class="panel"><span class="label">By department</span>${bars(countBy(arr,i=>i.dept),openBy(arr,i=>i.dept))}</div>
    <div class="panel"><span class="label">Likely cause</span>${bars(causes,null)}</div>
    ${lists.showShift?`<div class="panel"><span class="label">By shift</span>${bars(countBy(arr,i=>i.shift),null)}</div>`:''}
    <div class="panel"><span class="label">Repeat spots</span>${combos.length?`<div class="hot">${combos.map(([k,v])=>`<div><b>${v}×</b><span>${esc(k)}</span></div>`).join('')}</div>`:'<p class="note">No department and issue pair has come up twice yet.</p>'}</div>
    <div class="panel"><span class="label">Repeat planograms</span>${pogs.length?`<div class="hot">${pogs.map(([k,v])=>`<div><b>${v}×</b><span>${esc(k)}</span></div>`).join('')}</div>`:'<p class="note">No planogram has come up twice yet.</p>'}</div>
  </div>
  <div class="row"><button class="btn small" id="copySum">Copy summary for Teams</button><button class="btn small" id="sExport">Download report</button></div>`}`;
  $('#sRange').onchange=e=>{srange=e.target.value;ls.set('roil.srange',srange);renderStats()};
  const cs=$('#copySum');if(cs)cs.onclick=()=>copyText(summaryText(arr,r));
  const se=$('#sExport');if(se)se.onclick=()=>exportReport(arr);
}
function summaryText(arr,r){
  const lbl={'1':'last 24 hours','7':'last 7 days','30':'last 30 days','90':'last 90 days','all':'all time'}[r];
  const L=[`ROIL summary · ${lbl} · ${arr.length} issues`];
  const add=(t,e)=>{if(e.length)L.push('',t,...e.slice(0,5).map(([k,v])=>`• ${k}: ${v}`))};
  add('Top issues',countBy(arr,i=>i.issue));add('Top departments',countBy(arr,i=>i.dept));add('Likely causes',countBy(arr.filter(i=>i.cause),i=>i.cause));
  const o=openItems();L.push('',`Still open: ${o.length}`);
  return L.join('\n');
}

const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function save(filename,data){
  const b=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.csv')?'text/csv':'text/html'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),30000);
}

  if(arr.some(x=>x.toLowerCase()===v.toLowerCase())){toast(`"${v}" is already in this list.`);return}
  if(k==='dept'){lists.departments.push([v,[]]);openDepts.add(v)}else getArr(k).push(v);
  input.value='';commitLists();
  const again=document.getElementById(input.id);if(again)again.focus();
}
(function bindLists(){
  const el=$('#v-lists');
  el.addEventListener('toggle',e=>{const d=e.target.closest&&e.target.closest('details.dept');if(!d)return;const n=lists.departments[+d.dataset.di]?.[0];if(n)(d.open?openDepts.add(n):openDepts.delete(n))},true);
  el.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='rFile'){const f=t.files&&t.files[0];t.value='';if(f)doRestore(f);return}
    if(t.id==='tShift'){lists.showShift=t.checked;commitLists(t.checked?'Shift selector turned on.':'Shift selector archived.');return}
    if(t.dataset.dept!=null){const di=+t.dataset.dept,v=t.value.trim(),old=lists.departments[di][0];
      if(!v||v===old){t.value=old;return}
      if(lists.departments.some((d,i)=>i!==di&&d[0].toLowerCase()===v.toLowerCase())){toast(`"${v}" is already a department.`);t.value=old;return}
      lists.departments[di][0]=v;if(openDepts.delete(old))openDepts.add(v);if(form.dept===old)form.dept=v;commitLists();return}
    if(t.dataset.k&&t.dataset.i!=null){const arr=getArr(t.dataset.k),i=+t.dataset.i,v=t.value.trim();
      if(!v||v===arr[i]){t.value=arr[i];return}
      if(arr.some((x,j)=>j!==i&&x.toLowerCase()===v.toLowerCase())){toast(`"${v}" is already in this list.`);t.value=arr[i];return}
      arr[i]=v;commitLists()}
  });
  el.addEventListener('keydown',e=>{const t=e.target;if(e.key!=='Enter')return;
    if(t.dataset.add){e.preventDefault();addTo(t.dataset.add,t)}else if(t.matches('input[type=text]')){e.preventDefault();t.blur()}});
  el.addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]');if(!b)return;const act=b.dataset.act,k=b.dataset.k,i=+b.dataset.i;
    if(act==='add'){addTo(k,document.getElementById('add-'+k));return}
    if(act==='adddept'){addTo('dept',$('#add-dept'));return}
    if(act==='up'||act==='down'){const arr=getArr(k),j=act==='up'?i-1:i+1;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];commitLists();return}
    if(act==='del'){const arr=getArr(k);
      if((k==='issues')&&arr.length<=1){toast('Keep at least one issue type.');return}
      if(armedKey!==k+':'+i){arm(k+':'+i);return}
      armedKey=null;arr.splice(i,1);commitLists();return}
    if(act==='deldept'){const di=+b.dataset.di;
      if(lists.departments.length<=1){toast('Keep at least one department.');return}
      if(armedKey!=='dept:'+di){arm('dept:'+di);return}
      armedKey=null;const n=lists.departments[di][0];lists.departments.splice(di,1);openDepts.delete(n);commitLists(`Deleted ${n}.`);return}
    if(act==='bk-dl'){doBackup(false);return}
    if(act==='bk-share'){doBackup(true);return}
    if(act==='reset'){if(armedKey!=='reset'){arm('reset');return}armedKey=null;lists=normLists(null);commitLists('Starter lists restored.')}
  });
})();

/* ---------- toast ---------- */
let toastT;
function toast(msg,actions=[]){
  const host=$('#toastHost');clearTimeout(toastT);
  host.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${actions.map((a,i)=>`<button class="btn small" data-a="${i}">${esc(a[0])}</button>`).join('')}</div>`;
  host.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>actions[b.dataset.a][1]());
  toastT=setTimeout(()=>host.innerHTML='',actions.length?7000:3200);
}

boot();
</script>
