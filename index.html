/* ---------- SKUs, items found, lock-ups and scanning ----------
   Location SKU: the 7-digit Best Buy SKU on the shelf tag (ESL). Its QR code holds a link like
   http://bby.us/?c=BB017606594636&LMD=True, and the SKU is the last 7 digits of c.
   Items found: UPCs (or product SKUs) of what's actually on the shelf, with a quantity.
   Products directory: learns which UPCs belong to which SKU, so items can be marked right or wrong. */
const SKU_RE=/^\d{6,7}$/,UPC_RE=/^\d{8,14}$/;
function gtinOk(d){if(!/^(\d{8}|\d{12,14})$/.test(d))return false;let s=0;const n=d.length;for(let i=0;i<n-1;i++)s+=(+d[n-2-i])*(i%2===0?3:1);return (10-s%10)%10===+d[n-1]}
function upcE2A(e){const ns=e[0],d=e.slice(1,7),c=e[7],l=d[5];let m;
  if(l<='2')m=d[0]+d[1]+l+'0000'+d[2]+d[3]+d[4];else if(l==='3')m=d[0]+d[1]+d[2]+'00000'+d[3]+d[4];
  else if(l==='4')m=d[0]+d[1]+d[2]+d[3]+'00000'+d[4];else m=d[0]+d[1]+d[2]+d[3]+d[4]+'0000'+l;
  return ns+m+c}
/* Read a scanned or typed code: {kind:'sku'|'upc'|'bad', code, esl} */
function parseCode(raw){
  const t=String(raw||'').trim();
  if(/[?&]c=/i.test(t)||/bby\.us/i.test(t)){const m=t.match(/[?&]c=([^&#\s]+)/i);const dg=m?m[1].replace(/\D/g,''):'';return dg.length>=7?{kind:'sku',code:dg.slice(-7),esl:true}:{kind:'bad',code:t}}
  const dg=t.replace(/[\s-]/g,'');
  if(!/^\d+$/.test(dg))return {kind:'bad',code:t};
  if(SKU_RE.test(dg))return {kind:'sku',code:dg};
  if(dg.length===8){if(/^[01]/.test(dg)){const a=upcE2A(dg);if(gtinOk(a))return {kind:'upc',code:a}}return gtinOk(dg)?{kind:'upc',code:dg}:{kind:'bad',code:dg}}
  if(dg.length>=12&&dg.length<=14){let c=dg;if(c.length===14&&c.startsWith('00'))c=c.slice(2);else if(c.length===13&&c[0]==='0')c=c.slice(1);return gtinOk(c)?{kind:'upc',code:c}:{kind:'bad',code:dg,check:true}}
  return {kind:'bad',code:dg};
}
const bbUrl=sku=>`https://www.bestbuy.com/site/searchpage.jsp?st=${encodeURIComponent(sku)}`;
function cleanFound(a){
  if(!Array.isArray(a))return [];const out=[];
  for(const x of a.slice(0,50)){if(!x||typeof x!=='object')continue;const code=String(x.code||'');const kind=x.kind==='sku'?'sku':'upc';
    if(kind==='sku'?!SKU_RE.test(code):!UPC_RE.test(code))continue;const qty=Math.max(1,Math.min(999,parseInt(x.qty,10)||1));
    const ex=out.find(o=>o.code===code&&o.kind===kind);if(ex)ex.qty=Math.min(999,ex.qty+qty);else out.push({code,kind,qty})}
  return out;
}

/* ---------- products directory (synced, merged entry by entry: newest edit wins) ---------- */
let prods={skus:{},upcs:{}};
function cleanProds(p){
  const o={skus:{},upcs:{}};if(!p||typeof p!=='object')return o;
  for(const [k,v] of Object.entries(p.skus||{})){if(!SKU_RE.test(k)||!v||typeof v!=='object')continue;
    o.skus[k]={name:String(v.name||'').slice(0,80),deptId:ENTRY_ID.test(String(v.deptId||''))?String(v.deptId):'',planogramId:ENTRY_ID.test(String(v.planogramId||''))?String(v.planogramId):'',deleted:!!v.deleted,updated:String(v.updated||'').slice(0,40)};
    const s=o.skus[k];s.locs=Array.isArray(v.locs)?v.locs.filter(l=>l&&ENTRY_ID.test(String(l.d||''))&&(!l.p||ENTRY_ID.test(String(l.p)))).slice(0,8).map(l=>({d:String(l.d),p:l.p?String(l.p):'',n:Math.max(1,Math.min(99999,parseInt(l.n,10)||1)),t:String(l.t||'').slice(0,40)})):[];
    if(!s.locs.length&&s.deptId)s.locs=[{d:s.deptId,p:s.planogramId,n:1,t:s.updated}]}
  for(const [k,v] of Object.entries(p.upcs||{})){if(!UPC_RE.test(k)||!v||typeof v!=='object')continue;
    o.upcs[k]={sku:SKU_RE.test(String(v.sku||''))?String(v.sku):'',no:Array.isArray(v.no)?v.no.filter(x=>SKU_RE.test(String(x))).map(String).slice(-20):[],updated:String(v.updated||'').slice(0,40)}}
  return o;
}
function mergeProds(a,b){
  const o={skus:{...a.skus},upcs:{...a.upcs}};
  for(const t of['skus','upcs'])for(const [k,v] of Object.entries(b[t]))if(!o[t][k]||(v.updated||'')>(o[t][k].updated||''))o[t][k]=v;
  return o;
}
async function saveProds(){await write([{s:'meta',v:prods,k:'products'}]);markChanged()}
const nowIso=()=>new Date().toISOString();
const skuEntry=sku=>{const e=prods.skus[sku];return e&&!e.deleted?e:null};
const prodName=sku=>(skuEntry(sku)||{}).name||'';
const upcSku=upc=>(prods.upcs[upc]||{}).sku||'';
function setSkuInfo(sku,patch){const e=prods.skus[sku]&&!prods.skus[sku].deleted?prods.skus[sku]:{name:'',deptId:'',planogramId:''};prods.skus[sku]={...e,...patch,deleted:false,updated:nowIso()}}
/* Each SKU remembers every place it's been logged, most-used first (an item can be in more than one planogram). */
function addSkuLoc(sku,d,p){
  const e=skuEntry(sku)||{},locs=(e.locs||[]).map(l=>({...l})),t=nowIso();
  const x=locs.find(l=>l.d===d&&l.p===(p||''));if(x){x.n++;x.t=t}else locs.push({d,p:p||'',n:1,t});
  locs.sort((a,b)=>b.n-a.n||(b.t||'').localeCompare(a.t||''));
  setSkuInfo(sku,{locs:locs.slice(0,8),deptId:d,planogramId:p||''});
}
function skuLocs(sku){   // locations still in your lists
  const e=skuEntry(sku);if(!e)return [];
  const locs=e.locs&&e.locs.length?e.locs:e.deptId?[{d:e.deptId,p:e.planogramId||'',n:1,t:e.updated||''}]:[];
  return locs.filter(l=>{const d=IX.dept.get(l.d);return d&&!d.archived&&(!l.p||d.planograms.some(x=>x.id===l.p&&!x.archived))});
}
const locName=l=>{const d=IX.dept.get(l.d);const pg=l.p&&d?d.planograms.find(x=>x.id===l.p):null;return d?d.name+(pg?' › '+pg.name:''):'?'};
function linkUpc(upc,sku){const e=prods.upcs[upc]||{no:[]};prods.upcs[upc]={sku,no:(e.no||[]).filter(x=>x!==sku),updated:nowIso()};if(sku&&!skuEntry(sku))setSkuInfo(sku,{})}
function notHere(upc,sku){const e=prods.upcs[upc]||{sku:'',no:[]};prods.upcs[upc]={sku:e.sku===sku?'':e.sku,no:[...new Set([...(e.no||[]),sku])].slice(-20),updated:nowIso()}}
/* right / wrong / '' (unknown) for one item found at a location */
function verdict(f,loc){
  if(!loc)return '';
  if(f.kind==='sku')return f.code===loc?'right':'wrong';
  const e=prods.upcs[f.code];if(!e)return '';
  if(e.sku)return e.sku===loc?'right':'wrong';
  return (e.no||[]).includes(loc)?'wrong':'';
}
function foundLabel(f){const s=f.kind==='sku'?f.code:upcSku(f.code);const n=s?prodName(s):'';return {code:(f.kind==='sku'?'SKU ':'UPC ')+f.code,sub:f.kind==='upc'&&s?`SKU ${s}${n?' · '+n:''}`:(n||'')}}
function foundText(it,loc){
  return (it.found||[]).map(f=>{const v=verdict(f,loc);const l=foundLabel(f);return `${f.qty}× ${l.code}${l.sub?' ('+l.sub+')':''}${v==='right'?' · correct':v==='wrong'?' · wrong item':''}`});
}

/* ---------- camera scanning (Chrome on Android; elsewhere type codes or use a scanner) ---------- */
const canCam=typeof window.BarcodeDetector==='function'&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let camScan=null;   // the open camera scanner, if any
async function openScanner({title,hint,continuous,onCode}){
  if(!canCam){toast('This browser can\'t scan with the camera. Type the code, or use a Bluetooth scanner.');return}
  closeScanner();
  const host=$('#scanHost');
  host.innerHTML=`<div class="overlay scanov"><div class="sheet scansheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="head"><h2>${esc(title)}</h2><button class="btn small primary" type="button" id="scanDone">Done</button></div>
    <div class="scanview"><video id="scanVideo" playsinline muted></video><i class="scanframe"></i></div>
    <p class="note" id="scanMsg" style="margin:0">${esc(hint||'Point the camera at a shelf tag QR code or a product barcode.')}</p>
    <div class="row"><button class="btn small" type="button" id="scanTorch" hidden>Light</button></div>
    ${continuous?'<ul class="scanlog" id="scanLog"></ul>':''}</div></div>`;
  const S=camScan={onCode,continuous,stream:null,timer:null,seen:new Map(),done:false};
  $('#scanDone').onclick=closeScanner;
  $('.overlay',host).addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeScanner()});
  try{
    let formats=['qr_code','upc_a','upc_e','ean_13','ean_8','code_128'];
    try{const sup=await BarcodeDetector.getSupportedFormats();formats=formats.filter(f=>sup.includes(f))}catch(e){}
    const det=new BarcodeDetector({formats});
    S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    if(camScan!==S){S.stream.getTracks().forEach(t=>t.stop());return}
    const v=$('#scanVideo');v.srcObject=S.stream;await v.play().catch(()=>{});
    const track=S.stream.getVideoTracks()[0];let torch=false;
    try{const cap=track.getCapabilities&&track.getCapabilities();if(cap&&cap.torch){const b=$('#scanTorch');b.hidden=false;b.onclick=async()=>{torch=!torch;try{await track.applyConstraints({advanced:[{torch}]});b.setAttribute('aria-pressed',torch)}catch(e){}}}}catch(e){}
    const tick=async()=>{
      if(camScan!==S)return;
      try{
        if(v.readyState>=2){
          const now=performance.now();
          for(const r of await det.detect(v)){
            const raw=r.rawValue||'';const last=S.seen.get(raw);S.seen.set(raw,now);
            if(last&&now-last<1500)continue;          // still in view: counts once until it leaves the frame
            const c=parseCode(raw);if(c.kind==='bad')continue;
            try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
            const msg=S.onCode(c);
            if(!S.continuous){closeScanner();return}
            $('#scanMsg').textContent=msg||'Scanned.';
            const lg=$('#scanLog');if(lg&&msg){const li=document.createElement('li');li.textContent=msg;lg.prepend(li);while(lg.children.length>6)lg.lastChild.remove()}
          }
        }
      }catch(e){}
      if(camScan===S)S.timer=setTimeout(tick,140);
    };
    tick();
  }catch(e){
    const m=$('#scanMsg');if(m)m.textContent=e&&e.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this site in Chrome\'s settings, or type the code.':'Couldn\'t start the camera. Type the code instead.';
  }
}
function closeScanner(){
  const S=camScan;camScan=null;
  if(S){clearTimeout(S.timer);if(S.stream)S.stream.getTracks().forEach(t=>t.stop())}
  const h=$('#scanHost');if(h)h.innerHTML='';
}

/* ---------- the SKU box: location SKU, lock-up and items found (Log screen and issue screen) ---------- */
function SkuBox(root,st,opt={}){
  let naming=false,editing=-1,ev=null;
  const self={root,st,
    render(){
      const loc=st.sku,e=loc?skuEntry(loc):null,name=e?e.name:'';
      const rows=st.found.map((f,i)=>{const v=verdict(f,loc),l=foundLabel(f);
        const open=i===editing;
        return `<li class="frow v-${v||'unk'}${open?' editing':''}"><div class="fmain" data-edit="${i}" role="button" tabindex="0" aria-expanded="${open}" title="Tap to edit"><span class="fcode mono">${esc(l.code)}</span>${f.auto?`<span class="fsub">${esc(l.sub?l.sub+' · ':'')}from the shelf tag. Remove it if it's not here.</span>`:l.sub?`<span class="fsub">${esc(l.sub)}</span>`:''}
          <span class="fv">${v==='right'?'<span class="pill Fixed">Correct</span>':v==='wrong'?'<span class="pill bad">Wrong item</span>':loc?'<span class="pill">Not known yet</span>':'<span class="pill">Add the location SKU to check</span>'}</span>

          <div class="qty"><button type="button" class="ib" data-dec="${i}" aria-label="One less">−</button><span class="mono">${f.qty}</span><button type="button" class="ib" data-inc="${i}" aria-label="One more">+</button></div>${open?editHtml(f,v,loc):''}</li>`}).join('');
      const wrong=st.found.filter(f=>verdict(f,loc)==='wrong').length;
      const locH=`
        <div><label class="label" for="${opt.id}Sku">Location SKU <span class="lsub">from the shelf tag</span></label>
          <div class="skuin"><input type="text" id="${opt.id}Sku" class="skuInput mono" inputmode="numeric" autocomplete="off" maxlength="80" placeholder="${canCam?'Scan or type the SKU':'Type or scan the SKU'}" value="${esc(loc)}">${canCam?'<button type="button" class="btn" data-scan="sku">Scan</button>':''}</div>
          ${loc?`<div class="skuinfo">${naming?`<span class="ladd"><input type="text" class="nameIn" maxlength="80" placeholder="Product name" value="${esc(name)}" aria-label="Product name"><button type="button" class="btn small" data-savename>Save</button></span>`
            :`${(()=>{const L=skuLocs(loc);if(L.length<2||!opt.onPickLoc)return '';const c=opt.curLoc?opt.curLoc():{};
              return `<span class="locchips"><span class="lsub">Logged at</span>${L.map((l,i)=>`<button type="button" class="chip" data-loc="${i}" aria-pressed="${c.d===l.d&&c.p===l.p}">${esc(locName(l))} <span class="muted">${l.n}×</span></button>`).join('')}</span>`})()}${name?`<b>${esc(name)}</b> · <button type="button" class="linkish" data-name>Rename</button>`:'<button type="button" class="linkish" data-name>Add product name</button>'} · <a class="linkish" href="${bbUrl(loc)}" target="_blank" rel="noopener noreferrer">View on bestbuy.com</a> · <button type="button" class="linkish rm" data-clrsku>Clear</button>`}</div>`:''}
        </div>
        <label class="switch"><input type="checkbox" class="lockIn" ${st.lockup?'checked':''}><span>Lock-up <span class="lsub">customers can't reach it</span></span></label>`;
      const itemsH=`<div><span class="label">Items found <span class="lsub">${st.found.length?`${st.found.reduce((a,f)=>a+f.qty,0)} item${st.found.reduce((a,f)=>a+f.qty,0)===1?'':'s'}${wrong?` · ${wrong} wrong`:''}`:'what\'s actually there (optional)'}</span></span>
          ${rows?`<ul class="found">${rows}</ul>`:''}
          <div class="ladd${canCam?' three':''}"><input type="text" class="addCode mono" inputmode="numeric" autocomplete="off" maxlength="80" placeholder="Type a UPC" aria-label="Add an item by UPC or SKU"><button type="button" class="btn small" data-add>Add</button>${canCam?'<button type="button" class="btn small" data-scan="items">Scan items</button>':''}</div>
        </div>`;
      if(opt.itemsRoot){root.innerHTML=`<div class="skub">${locH}</div>`;opt.itemsRoot.innerHTML=`<div class="skub">${itemsH}</div>`}
      else root.innerHTML=`<div class="skub">${locH}${itemsH}</div>`;
      if(naming){const n=$('.nameIn',root);n.focus();n.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('[data-savename]',root).click()}}}
    },
    changed(){self.render();opt.onChange&&opt.onChange()},
    toggleEdit(i){editing=editing===i?-1:i;ev=null;self.render();if(editing>=0){const c=$('.fedit .eQty',opt.itemsRoot||root);if(c&&!dev.mobile)c.focus()}},
    async saveEdit(){
      const f=st.found[editing];if(!f)return;const R=opt.itemsRoot||root,loc=st.sku;
      const c=parseCode($('.eCode',R).value);
      if(c.kind==='bad'){toast(c.check?`${c.code} isn't a valid UPC (the check digit doesn't match).`:'Type a UPC, or a 6 or 7-digit SKU.');$('.eCode',R).focus();return}
      const qty=Math.max(1,Math.min(999,parseInt($('.eQty',R).value,10)||1));
      let changedProds=false;
      const dup=st.found.findIndex((x,j)=>j!==editing&&x.code===c.code&&x.kind===c.kind);
      if(dup>=0){st.found[dup].qty=Math.min(999,st.found[dup].qty+qty);st.found.splice(editing,1);editing=-1;self.changed();toast('Merged with the same item already on the list.');return}
      Object.assign(f,{code:c.code,kind:c.kind,qty});delete f.auto;
      if(f.kind==='upc'){
        const ps=$('.eSku',R),want=ps?ps.value.trim():'';
        if(want&&!SKU_RE.test(want)){toast('The product SKU is the 6 or 7-digit number for that product.');ps.focus();return}
        if(want!==upcSku(f.code)){if(want)linkUpc(f.code,want);else if(prods.upcs[f.code])prods.upcs[f.code]={...prods.upcs[f.code],sku:'',updated:nowIso()};changedProds=true}
        if(ev&&loc&&ev!==verdict(f,loc)){
          if(ev==='right')linkUpc(f.code,loc);else if(ev==='wrong')notHere(f.code,loc);
          else{const e=prods.upcs[f.code];if(e)prods.upcs[f.code]={sku:e.sku===loc?'':e.sku,no:(e.no||[]).filter(x=>x!==loc),updated:nowIso()}}
          changedProds=true}
      }
      const nm=$('.eName',R),ps=f.kind==='sku'?f.code:upcSku(f.code);   // after any pairing above
      if(nm&&!ps&&nm.value.trim())toast('Add the product SKU to save a name for it.');
      if(nm&&ps&&nm.value.trim()!==prodName(ps)){setSkuInfo(ps,{name:nm.value.trim().slice(0,80)});changedProds=true}
      if(changedProds)await saveProds();
      editing=-1;ev=null;self.changed();
    },
    setLoc(code,quiet){
      if(st.sku===code)return;
      const had=st.sku;st.sku=code;naming=false;
      // most of the time the product at fault is the one the tag is for, so it goes in as the first item
      const a=st.found.find(f=>f.auto);
      if(a){a.code=code;a.kind='sku'}else if(!st.found.length)st.found.push({code,kind:'sku',qty:1,auto:true});
      if(had&&!quiet)toast(`Location SKU changed to ${code}.`);
      opt.onSku&&opt.onSku(code);self.changed();
    },
    addItem(c){
      const a=st.found.find(f=>f.auto);
      if(a&&((c.kind==='sku'&&c.code===a.code)||(c.kind==='upc'&&upcSku(c.code)===a.code))){   // scanning the tag's own product confirms that item
        a.code=c.code;a.kind=c.kind;delete a.auto;self.changed();
        return `${c.kind==='sku'?'SKU':'UPC'} ${c.code} · correct`}
      const ex=st.found.find(f=>f.code===c.code&&f.kind===c.kind);
      if(ex)ex.qty=Math.min(999,ex.qty+1);else{if(st.found.length>=50){toast('That\'s the most items one issue can hold.');return ''}st.found.push({code:c.code,kind:c.kind,qty:1})}
      self.changed();
      const f=ex||st.found[st.found.length-1],v=verdict(f,st.sku);
      return `${c.kind==='sku'?'SKU':'UPC'} ${c.code}${f.qty>1?' ×'+f.qty:''}${v==='right'?' · correct':v==='wrong'?' · wrong item':''}`;
    },
    /* a scan from the camera or a Bluetooth scanner. ctx 'items' = scanning products */
    take(c,ctx){
      if(c.kind==='bad'){toast(c.check?`${c.code} isn't a valid UPC (the check digit doesn't match). Scan it again.`:`Couldn't read “${c.code.slice(0,30)}” as a SKU or UPC.`);return ''}
      if(c.kind==='sku'&&(c.esl||ctx!=='items'||!st.sku)){self.setLoc(c.code);return `Location SKU ${c.code}${prodName(c.code)?' · '+prodName(c.code):''}`}
      return self.addItem(c);
    }
  };
  for(const R of [root,opt.itemsRoot].filter(Boolean))R.addEventListener('click',async e=>{
    const ed=e.target.closest('[data-edit]');if(ed&&!e.target.closest('button')){self.toggleEdit(+ed.dataset.edit);return}
    const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if('ev' in d){ev=d.ev;t.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
    if('edone' in d){self.saveEdit();return}
    if('eremove' in d){st.found.splice(editing,1);editing=-1;self.changed();return}
    if('loc' in d){const L=skuLocs(st.sku);if(L[+d.loc]&&opt.onPickLoc)opt.onPickLoc(L[+d.loc]);return}
    if(d.scan){openScanner(d.scan==='sku'?{title:'Scan the shelf tag',hint:'Point the camera at the QR code on the shelf tag (ESL).',onCode:c=>self.take(c,'sku')}
      :{title:'Scan items',hint:'Scan each product\'s UPC. Scan the same product again to count another one.',continuous:true,onCode:c=>self.take(c,'items')});return}
    if('add' in d){const inp=$('.addCode',R);const v=inp.value.trim();if(!v)return;const c=parseCode(v);if(c.kind==='bad'){self.take(c);return}inp.value='';self.take(c,'items');const again=$('.addCode',R);if(again)again.focus();return}
    if('inc' in d||'dec' in d){const f=st.found[+(d.inc??d.dec)];if(!f)return;delete f.auto;if('inc' in d)f.qty=Math.min(999,f.qty+1);else if(f.qty>1)f.qty--;else{st.found.splice(+d.dec,1);editing=-1}if(editing>=0){const q=$('.eQty',R);if(q)q.value=st.found[editing].qty}self.changed();return}
    if('belong' in d||'diff' in d){const f=st.found[+(d.belong??d.diff)];if(!f||!st.sku)return;
      if('belong' in d){linkUpc(f.code,st.sku);toast(`Got it. UPC ${f.code} belongs to SKU ${st.sku}.`)}else{notHere(f.code,st.sku);toast('Marked as a wrong item. Pair it with its own SKU in Lists → Products when you can.')}
      await saveProds();self.changed();return}
    if('name' in d){naming=true;self.render();return}
    if('savename' in d){const n=$('.nameIn',root).value.trim().slice(0,80);setSkuInfo(st.sku,{name:n});naming=false;await saveProds();self.changed();return}
    if('clrsku' in d){st.sku='';st.found=st.found.filter(f=>!f.auto);naming=false;self.changed();return}
  });
  for(const R of [root,opt.itemsRoot].filter(Boolean))R.addEventListener('change',e=>{
    const t=e.target;
    if(t.classList.contains('lockIn')){st.lockup=t.checked;opt.onChange&&opt.onChange('lockup');return}
    if(t.classList.contains('skuInput')){const v=t.value.trim();if(!v){if(st.sku){st.sku='';st.found=st.found.filter(f=>!f.auto);self.changed()}return}
      const c=parseCode(v);if(c.kind==='sku'){self.setLoc(c.code,true);if(st.sku===c.code)self.render()}else{toast(c.kind==='upc'?'That looks like a product UPC. Add it under Items found; the location SKU is the 7-digit number on the shelf tag.':'A SKU is the 6 or 7-digit number on the shelf tag.');t.value=st.sku}}
  });
  for(const R of [root,opt.itemsRoot].filter(Boolean))R.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    if(e.target.classList.contains('addCode')){e.preventDefault();$('[data-add]',R).click()}
    else if(e.target.closest('.fedit')&&e.target.tagName==='INPUT'){e.preventDefault();self.saveEdit()}
    else if(e.target.matches('[data-edit]')){e.preventDefault();self.toggleEdit(+e.target.dataset.edit)}
    else if(e.target.classList.contains('skuInput')){e.preventDefault();e.target.blur()}
  });
  for(const R of [root,opt.itemsRoot].filter(Boolean))R.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('skuInput')&&/^\d{7}$/.test(t.value.trim()))t.blur()});
  self.render();
  return self;
}

/* ---------- Bluetooth / USB barcode scanners (keyboard mode) ----------
   A scanner "types" the code very fast and presses Enter. ROIL spots that burst anywhere in the app
   and sends the code to Pair mode, an open issue, or the Log screen. */
let detailBox=null,pairTake=null;
function routeScan(raw){
  const c=parseCode(raw);
  if(camScan){const m=camScan.onCode(c);if(m){const s=$('#scanMsg');if(s)s.textContent=m}return}
  if(pairTake){pairTake(c);return}
  if(runPickTake){runPickTake(c);return}
  if(mode==='ds'&&!detailBox){   // on the Downstock board, a shelf tag opens its planogram
    const s=c.kind==='sku'?c.code:c.kind==='upc'?upcSku(c.code):'';const L=s?skuLocs(s):[];
    const area=L.length?(L[0].p&&dsArea(L[0].p)?L[0].p:L[0].d):'';
    if(area&&dsArea(area)){if(view!=='ds')setView('ds');openAreaSheet(area)}else toast(s?`ROIL doesn't know where SKU ${s} lives yet.`:'Scan a shelf tag to open its planogram.');
    return}
  if(detailBox&&detailBox.root.isConnected){detailBox.take(c,'auto');return}
  if(view!=='log')setView('log');
  if(logBox){logBox.take(c,'auto');if(c.kind!=='bad')toast(c.kind==='sku'?`Location SKU ${c.code}`:`Added ${c.kind==='sku'?'SKU':'UPC'} ${c.code}`)}
}
(function hidScanner(){
  let buf='',t0=0,last=0;
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.altKey||e.metaKey)return;
    const now=performance.now();
    if(now-last>45){buf='';t0=now}
    last=now;
    if(e.key==='Enter'||e.key==='Tab'){
      if(buf.length>=6&&(now-t0)/buf.length<30){
        e.preventDefault();e.stopPropagation();
        const el=document.activeElement;   // a scan into a text box: take the typed code back out
        if(el&&/^(INPUT|TEXTAREA)$/.test(el.tagName)&&typeof el.value==='string'&&el.value.endsWith(buf)){el.value=el.value.slice(0,-buf.length)}
        const code=buf;buf='';routeScan(code);return;
      }
      buf='';return;
    }
    if(e.key&&e.key.length===1)buf+=e.key;
  },true);
})();

/* ---------- Pair mode: scan a shelf tag, then the products that belong there ---------- */
function openPairMode(){
  let cur='';const log=[];
  const paint=()=>{const s=$('#pairSku');if(!s)return;s.textContent=cur||'None yet';$('#pairName').textContent=cur&&prodName(cur)?prodName(cur):'';
    $('#pairLog').innerHTML=log.slice(0,12).map(l=>`<li>${esc(l)}</li>`).join('')};
  pairTake=c=>{
    let msg;
    if(c.kind==='bad')msg=c.check?`${c.code}: check digit doesn't match. Scan again.`:`Couldn't read “${c.code.slice(0,30)}”.`;
    else if(c.kind==='sku'){cur=c.code;if(!skuEntry(cur)){setSkuInfo(cur,{});saveProds()}msg=`Shelf tag: SKU ${cur}${prodName(cur)?' · '+prodName(cur):''}`}
    else if(!cur)msg='Scan the shelf tag first, so ROIL knows which SKU these belong to.';
    else{const was=upcSku(c.code);
      if(was===cur)msg=`UPC ${c.code} is already paired with SKU ${cur}.`;
      else{linkUpc(c.code,cur);saveProds();msg=`UPC ${c.code} → SKU ${cur}${was?` (moved from SKU ${was})`:''}`}}
    log.unshift(msg);paint();return msg;
  };
  openSheet(`<div class="head"><h2>Pair mode</h2><button class="btn small primary" data-close>Done</button></div>
  <p class="note" style="margin:0">Scan a shelf tag, then each product that belongs on it. Every product you scan is paired with that tag's SKU, so ROIL can tell right items from wrong ones. Scan the next tag to move on.</p>
  <div class="pairnow"><span class="label" style="margin:0">Current shelf tag</span><b class="mono" id="pairSku"></b><span class="muted" id="pairName"></span></div>
  ${canCam?'<button class="btn primary big" type="button" id="pairCam">Scan with camera</button>':''}
  <div class="ladd"><input type="text" id="pairIn" class="mono" inputmode="numeric" autocomplete="off" placeholder="Type a SKU or UPC, or use a scanner" aria-label="SKU or UPC"><button class="btn small" type="button" id="pairAdd">Add</button></div>
  <ul class="scanlog" id="pairLog"></ul>`,()=>{pairTake=null;if(view==='lists')renderLists()});
  const add=()=>{const i=$('#pairIn');const v=i.value.trim();if(!v)return;i.value='';pairTake(parseCode(v));i.focus()};
  $('#pairAdd').onclick=add;$('#pairIn').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  const pc=$('#pairCam');if(pc)pc.onclick=()=>openScanner({title:'Pair mode',hint:'Scan a shelf tag QR, then its products\' UPCs.',continuous:true,onCode:c=>pairTake?pairTake(c):''});
  paint();
}

/* ---------- Lists → Products ---------- */
let prodQ='';const openSkus=new Set();
function unknownUpcs(){
  const m=new Map();
  for(const it of items)for(const f of it.found||[])if(f.kind==='upc'&&!upcSku(f.code)){const x=m.get(f.code)||{n:0,at:new Set()};x.n++;if(it.sku)x.at.add(it.sku);m.set(f.code,x)}
  return [...m.entries()].sort((a,b)=>b[1].n-a[1].n);

/* ---------- possible duplicates: an open issue for the same item ---------- */
function findDuplicates(f,exceptId){
  const codes=new Set((f.found||[]).map(x=>x.kind+':'+x.code));const out=[];
  for(const it of items){
    if(it.id===exceptId||it.status==='Fixed')continue;
    let why='';
    if(f.sku&&it.sku===f.sku)why='Same location SKU';
    else if(codes.size&&(it.found||[]).some(x=>codes.has(x.kind+':'+x.code)))why='Same item found';
    else if(f.planogramId&&it.deptId===f.deptId&&it.planogramId===f.planogramId&&it.issueId===f.issueId&&(!f.sku||!it.sku))why='Same planogram and issue';
    if(why)out.push({it,why});
  }
  return out.sort((a,b)=>(a.why==='Same planogram and issue')-(b.why==='Same planogram and issue')||(a.it.created<b.it.created?1:-1)).slice(0,5);
}

const photoSrc=it=>it.photo?(photoUrls.get(it.id)||thumbUrls.get(it.id)||''):'';
const thumbSrc=it=>it.photo?(thumbUrls.get(it.id)||''):'';
const photoName=it=>`ROIL ${localDay(new Date(it.created))} ${it.issue.replace(/[\/\\:*?"<>|]/g,'-')}.jpg`;
async function photoFile(it){
  if(!it.photo)return null;
  const b=await ensureFull(it.id);
  if(!b)throw new Error('photo missing');
  return new File([b],photoName(it),{type:'image/jpeg'});
}
function cardText(it){
  const lines=[`ROIL · ${it.issue}`,`${fmtDT(it.created)}${it.shift?' · '+it.shift:''}`,`Dept: ${it.dept}`];
  if(it.planogram)lines.push(`Planogram: ${it.planogram}`);
  if(it.sku)lines.push(`Location SKU: ${it.sku}${prodName(it.sku)?' ('+prodName(it.sku)+')':''}`);
  if(it.lockup)lines.push('Lock-up');
  const ft=foundText(it,it.sku);if(ft.length)lines.push('Items found:',...ft.map(x=>'  '+x));
  if(it.source)lines.push(`Source: ${it.source}`);
  if(it.cause)lines.push(`Cause: ${it.cause}`);
  if(it.prs&&it.prs.length)lines.push(`PRS missed: ${prsText(it.prs)}`);
  if(it.ds)lines.push('Found while downstocking');
  if(isDemoIssue(it.issueId))lines.push(`RITE: ${it.rite?'submitted'+(it.riteNo?' #'+it.riteNo:''):'not submitted yet'}`);
  lines.push(`Status: ${it.status}${it.status!=='Fixed'?' (open '+age(it.created)+')':''}`);
  if(it.note)lines.push(`Note: ${it.note}`);
  return lines.join('\n');
}
function openListText(arr){
  if(!arr.length)return 'ROIL · No open floor issues.';
  return [`ROIL · Open floor issues (${arr.length}) · ${fmtD(new Date())}`,...arr.map(it=>`• ${it.issue} · ${it.dept}${it.planogram?' · PG '+it.planogram:''} · ${it.status==='Needs follow-up'?'needs follow-up':'open'} ${age(it.created)}${it.note?'\n   '+it.note:''}`)].join('\n');

/* Share menu: photo + text together. The text is also put on the clipboard first,
   so if Teams drops it you can paste it into the comment box. Pass a file promise
   that was started earlier, so the tap's permission to share doesn't time out. */
async function shareItem(it,fileP){
  const text=cardText(it);
  let copied=false;try{await navigator.clipboard.writeText(text);copied=true}catch(e){}
  if(!navigator.share){toast(copied?'This browser can\'t open the share menu. The details are copied.':'This browser can\'t open the share menu.');return}
  if(!fileP&&it.photo)fileP=photoFile(it);
  const file=fileP?await Promise.resolve(fileP).catch(()=>null):null;
  const af=it.after?await ensureFull(it.id,'after').then(b=>b?new File([b],photoName(it).replace(/\.jpg$/,' after.jpg'),{type:'image/jpeg'}):null).catch(()=>null):null;
  const data={title:`ROIL · ${it.issue}`,text};
  const files=[file,af].filter(Boolean);
  if(files.length&&navigator.canShare&&navigator.canShare({files}))data.files=files;
  try{await navigator.share(data);if(copied)toast('Shared. If the text didn\'t come through, paste it. It\'s on your clipboard.')}
  catch(e){if(e&&e.name==='AbortError')return;toast(copied?'Couldn\'t open the share menu. The details are copied, so use Copy photo too.':'Couldn\'t open the share menu.')}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into Teams.')}
  catch(e){showCopyFallback(t)}
}
function showCopyFallback(t){
  openSheet(`<div class="head"><h2>Copy this text</h2><button class="btn small" data-close>Close</button></div><p class="note">Copying was blocked. Select the text below, copy it, then paste into Teams.</p><textarea id="cpy" style="min-height:200px" readonly>${esc(t)}</textarea>`);
  const ta=$('#cpy');ta.focus();ta.select();
}
function cardHtml(it,dataUrl){
  const rows=cardText(it).split('\n');
  return `<div>${dataUrl?`<img src="${dataUrl}" width="480" alt="Issue photo"><br>`:''}<b>${esc(rows[0])}</b><br>${rows.slice(1).map(esc).join('<br>')}</div>`;
}
function toPng(blob){
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();
    i.onload=()=>{const sc=Math.min(1,1280/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*sc);c.height=Math.round(i.naturalHeight*sc);
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png')};
    i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u});
}
const canCopyImages=()=>!!(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write);
/* Photo + details in one copy: plain text, formatted text with the photo, and the photo alone.
   Built inside the tap with the image parts as promises; falls back to text only. */
async function copyItem(it){
  if(!it)return;
  const text=cardText(it);
  if(!it.photo||!canCopyImages())return copyText(text);
  try{
    const jpg=photoFile(it);
    const item=new ClipboardItem({
      'text/plain':new Blob([text],{type:'text/plain'}),
      'text/html':jpg.then(blobToDataUrl).then(d=>new Blob([cardHtml(it,d)],{type:'text/html'})),
      'image/png':jpg.then(toPng)
    });
    await navigator.clipboard.write([item]);
    toast('Copied photo and details. Paste into Teams.');
  }catch(e){
    try{await navigator.clipboard.writeText(text);toast('Copied the details only. Use Copy photo or Share for the picture.')}
    catch(e2){showCopyFallback(text)}
  }
}
async function copyPhoto(it){
  if(!it.photo)return;
  if(!canCopyImages()){toast('This browser can\'t copy photos. Use Share instead.');return}
  try{await navigator.clipboard.write([new ClipboardItem({'image/png':photoFile(it).then(toPng)})]);toast('Copied the photo. Paste it into Teams.')}
  catch(e){toast('Copying the photo was blocked. Use Share instead.')}
}

function countBy(arr,fn){const m=new Map();for(const it of arr){const k=fn(it)||'Not set';m.set(k,(m.get(k)||0)+1)}return [...m.entries()].sort((a,b)=>b[1]-a[1])}

}
function trend(arr,r){
  const daily=r==='1'||r==='7'||r==='30';const n=r==='1'?1:r==='7'?7:r==='30'?30:12;
  const buckets=[];const today=new Date();today.setHours(0,0,0,0);
  if(daily){for(let i=n-1;i>=0;i--){const s=new Date(today);s.setDate(s.getDate()-i);const e=new Date(s);e.setDate(e.getDate()+1);buckets.push({s,e,label:r==='30'?String(s.getDate()):s.toLocaleDateString(undefined,{weekday:'short'})})}}
  else{const ws=new Date(today);ws.setDate(ws.getDate()-ws.getDay());for(let i=n-1;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);buckets.push({s,e,label:fmtD(s)})}}
  for(const b of buckets)b.v=arr.filter(it=>{const d=new Date(it.created);return d>=b.s&&d<b.e}).length;
  const max=Math.max(1,...buckets.map(b=>b.v));

  return `<div class="trend">${buckets.map(b=>`<div class="c" title="${esc(b.label)}: ${b.v}">${b.v&&buckets.length<=14?`<b style="bottom:${b.v/max*100}%;top:auto;transform:translateY(-2px)">${b.v}</b>`:''}<i style="height:${b.v/max*100}%"></i></div>`).join('')}</div>
  <div class="tlabels">${buckets.map((b,i)=>`<span>${(buckets.length-1-i)%step===0?esc(b.label):''}</span>`).join('')}</div>

/* After photos for issues already logged */
/* Add, replace (file) or remove (null) an issue's before or after photo. Each new photo gets a new
   revision, so other devices fetch it and the old file leaves Google Drive. */
async function setItemPhoto(id,which,file){
  const it=items.find(i=>i.id===id);if(!it)throw new Error('gone');
  const A=which==='after',rec={...(await getOne('photos',id).catch(()=>null)||{}),id},patch={};
  if(file){
    const full=await compress(file,2048,.85),th=await compress(file,480,.75),rev=newRev();
    if(A){Object.assign(rec,{after:full,afterThumb:th,afterRev:rev});Object.assign(patch,{after:true,afterRev:rev});
      if(it.status!=='Fixed'){patch.status='Fixed';patch.fixedAt=new Date().toISOString()}}
    else{Object.assign(rec,{full,thumb:th,photoRev:rev});Object.assign(patch,{photo:true,photoRev:rev})}
  }else if(A){delete rec.after;delete rec.afterThumb;delete rec.afterRev;Object.assign(patch,{after:false,afterRev:''})}
  else{delete rec.full;delete rec.thumb;delete rec.photoRev;Object.assign(patch,{photo:false,photoRev:''})}
  await write([{s:'photos',v:rec}]);setPhotoUrls(rec);
  await store.patch(id,patch);
  return patch;
}

  try{const p=await setItemPhoto(id,'after',file);toast(p.status?'After photo added. Marked fixed.':'After photo added.')}

}

    if(act==='bk-share'){doBackup(true);return}
    if(act==='reset'){if(armedKey!=='reset'){arm('reset');return}armedKey=null;
      const keep={removed:lists.removed,moved:lists.moved};lists=normLists(null);Object.assign(lists,keep);
      commitLists('Starter lists restored. Entries your issues still use were kept as archived.')}
  });
})();

/* ---------- toast ---------- */
let toastT;
function toast(msg,actions=[]){
  const host=$('#toastHost');clearTimeout(toastT);
  host.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${actions.map((a,i)=>`<button class="btn small" data-a="${i}">${esc(a[0])}</button>`).join('')}</div>`;
  host.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>actions[b.dataset.a][1]());
  toastT=setTimeout(()=>host.innerHTML='',actions.length?7000:3200);
}

boot();
</script>
